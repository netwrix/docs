        default_system_config_linux:
          type: object
          properties:
            directory_bridging:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                  - secureone
                  - centrify
                  - powerbroker
                  - sssd
                  - none
    CfgEntraConfig:
      type: object
      description: A stored Entra ID tenant configuration. The client secret is never returned.
      properties:
        id:
          type: string
          example: 00000000000000000000000b
        _id:
          type: string
          description: Present in list items only (same value as `id`).
        name:
          type: string
        client_id:
          type: string
        tenant_id:
          type: string
        modified_timestamp:
          type: string
          format: date-time
        sync:
          $ref: '#/components/schemas/CfgSyncState'
        sync_enabled:
          type: boolean
        syncActivity:
          type: object
          readOnly: true
          properties:
            errorCode:
              type: number
            errorMessage:
              type: string
            startTs:
              type: string
              format: date-time
            activity:
              type: string
        failover_config:
          $ref: '#/components/schemas/CfgFailoverConfig'
        scan_config:
          $ref: '#/components/schemas/CfgScanConfig'
        domain_fqdn:
          type: string
        domain_netbios:
          type: string
        managed_sids:
          $ref: '#/components/schemas/CfgManagedSidsPolicy'
        default_system_config:
          $ref: '#/components/schemas/CfgDefaultSystemConfig'
        default_system_config_linux:
          type: object
          properties:
            directory_bridging:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                  - secureone
                  - centrify
                  - powerbroker
                  - sssd
                  - none
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CfgEntraValidateRequest:
      type: object
      properties:
        client_id:
          type: string
        tenant_id:
          type: string
        client_secret:
          type: string
          format: password
          writeOnly: true
    CfgMacosWrite:
      type: object
      properties:
        domain_fqdn:
          type: string
          maxLength: 255
          description: Required on create. Must match a configured domain.
          example: example.com
        service_acct:
          type: object
          properties:
            domain:
              type: string
              nullable: true
              maxLength: 255
            svcUser:
              type: string
              maxLength: 255
              example: svc-netwrix
            svcPass:
              type: string
              format: password
              writeOnly: true
              maxLength: 255
    CfgMacosConfig:
      type: object
      properties:
        _id:
          type: string
          example: 00000000000000000000000d
        domain_fqdn:
          type: string
          nullable: true
        ldap_id_temp:
          type: string
        service_acct:
          type: object
          description: The password is never returned.
          properties:
            domain:
              type: string
              nullable: true
            svcUser:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CfgRadiusConfig:
      type: object
      properties:
        id:
          type: string
        server:
          type: string
          example: radius.example.com
          description: Empty string until configured.
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 1812
          nullable: true
        enabled:
          type: boolean
          default: false
        timeout:
          type: integer
          description: Milliseconds.
          minimum: 10000
          maximum: 180000
          default: 30000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CfgSsoConfig:
      type: object
      properties:
        id:
          type: string
        entrypoint:
          type: string
          description: Identity provider SSO URL.
          example: https://idp.example.com/sso
        issuer:
          type: string
          example: netwrix-privilege-secure
        cert:
          type: string
          description: Identity provider signing certificate (PEM).
        enabled:
          type: boolean
          default: false
        sso_flow:
          type: string
          enum:
          - sp_init
          - idp_init
          default: sp_init
        force_reauth:
          type: boolean
          default: false
        auto_redirect_enabled:
          type: boolean
          default: false
        user_identifier_attribute:
          type: string
          default: dn
          description: SAML attribute that identifies the user.
        user_identifier_db_field:
          type: string
          default: distinguishedName
          description: User field matched against the SAML attribute, or a `${field}` template.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - saml_config
          description: Present only on the call that creates the default document.
        __v:
          type: integer
    CfgCertificateSlot:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        meta:
          type: object
          description: Certificate details computed on upload. The private key and PEM are not included.
          properties:
            certInfo:
              type: object
              properties:
                issuer:
                  type: object
                  description: country, state, locality, organization, organizationUnit, commonName, dc
                    (all strings, empty when absent).
                  additionalProperties:
                    type: string
                serial:
                  type: string
                  example: 39:09:10:32:43:50:02:2f:db:ca:b9:68:04:5a:bd:73
                country:
                  type: string
                state:
                  type: string
                locality:
                  type: string
                organization:
                  type: string
                organizationUnit:
                  type: string
                commonName:
                  type: string
                  example: localhost
                emailAddress:
                  type: string
                dc:
                  type: string
                san:
                  type: object
                  properties:
                    dns:
                      type: array
                      items:
                        type: string
                    ip:
                      type: array
                      items:
                        type: string
                    email:
                      type: array
                      items:
                        type: string
                validity:
                  type: object
                  description: Milliseconds since the epoch.
                  properties:
                    start:
                      type: integer
                    end:
                      type: integer
                signatureAlgorithm:
                  type: string
                  example: sha256WithRSAEncryption
                publicKeySize:
                  type: string
                  example: 2048 bit
                publicKeyAlgorithm:
                  type: string
                  example: rsaEncryption
            keyMod:
              type: object
              description: RSA public modulus (hex); not secret.
              properties:
                modulus:
                  type: string
    CfgServerCertificate:
      type: object
      description: Certificate metadata. The key and PEM are never returned.
      properties:
        id:
          type: string
          description: Present. Top-level keys are createdAt, current, id, type, updatedAt.
        type:
          type: string
          enum:
          - server_tls
        current:
          $ref: '#/components/schemas/CfgCertificateSlot'
        previous:
          description: Absent until the certificate has been replaced once.
          allOf:
          - $ref: '#/components/schemas/CfgCertificateSlot'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PlatformObjectId:
      type: string
      pattern: ^[0-9a-fA-F]{24}$
      example: 00000000000000000000000a
    PlatformUserLinuxConfig:
      type: object
      description: Properties used when the account is created on a Linux system.
      properties:
        uid:
          type: integer
          example: 10001
        gid:
          type: integer
          example: 10001
        home_dir:
          type: string
          example: /home/euser
        default_shell:
          type: string
          example: /bin/bash
    PlatformUser:
      type: object
      description: A directory user. Fields beyond the list defaults appear only on the single-user endpoint.
      properties:
        id:
          type: string
          example: 00000000000000000000000a
        _id:
          type: string
          description: Present on list responses only (list results are returned unconverted).
          example: 00000000000000000000000a
        distinguishedName:
          type: string
          example: CN=Example User,OU=Users,DC=example,DC=com
        displayName:
          type: string
          example: Example User
        cn:
          type: string
          example: Example User
        sn:
          type: string
          example: User
        sAMAccountName:
          type: string
          example: euser
        objectSid:
          type: string
          example: S-1-5-21-1111111111-2222222222-3333333333-1001
        domain_fqdn:
          type: string
          example: example.com
        domain_netbios:
          type: string
          example: EXAMPLE
        isEntraId:
          type: boolean
        isHybrid:
          type: boolean
        inserted_ts:
          type: string
          format: date-time
        updated_ts:
          type: string
          format: date-time
        rmd:
          type: object
          properties:
            lastLogonTimestamp:
              type: string
              format: date-time
            userAccountControl:
              description: Directory userAccountControl value.
        access:
          type: object
          description: Role mapping, present when the user is mapped to a product role.
          properties:
            role:
              type: string
              description: Product role (superadmin, admin or user).
            date_added:
              type: string
              format: date-time
        linux_config:
          $ref: '#/components/schemas/PlatformUserLinuxConfig'
    PlatformUserUpdate:
      type: object
      required:
      - linux_config
      properties:
        linux_config:
          $ref: '#/components/schemas/PlatformUserLinuxConfig'
    PlatformUserHistoryItem:
      type: object
      properties:
        processed:
          type: string
          format: date-time
          description: When the request was processed (or the event last updated).
          nullable: true
        system:
          type: object
          properties:
            cn:
              type: string
              example: HOST01
        request:
          type: object
          properties:
            activity:
              type: array
              items:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  code:
                    type: integer
                  message:
                    type: string
            user:
              type: object
              description: The user (populated record).
            status:
              type: string
            type:
              type: string
              description: Request type (for example `access`) or password-management event type.
            expires:
              type: string
              format: date-time
              description: Present only for access requests.
        comment:
          type: string
    PlatformGroup:
      type: object
      properties:
        id:
          type: string
          example: 00000000000000000000000c
        _id:
          type: string
          description: Present on list responses only.
        distinguishedName:
          type: string
          example: CN=Example Admins,OU=Groups,DC=example,DC=com
        displayName:
          type: string
        cn:
          type: string
          example: Example Admins
        sAMAccountName:
          type: string
        objectSid:
          type: string
          example: S-1-5-21-1111111111-2222222222-3333333333-1101
        domain_fqdn:
          type: string
          example: example.com
        domain_netbios:
          type: string
          example: EXAMPLE
        isEntraId:
          type: boolean
        isHybrid:
          type: boolean
        access:
          type: object
          properties:
            role:
              type: string
            date_added:
              type: string
              format: date-time
        member:
          type: array
          description: Distinguished names of members. Single-group endpoint only.
          items:
            type: string
        memberOf:
          type: array
          description: Distinguished names of parent groups. Single-group endpoint only.
          items:
            type: string
        updated_ts:
          type: string
          format: date-time
    PlatformQueueDismiss:
      type: object
      required:
      - request.status
      properties:
        request.status:
          type: string
          enum:
          - dismissed
    PlatformQueueItem:
      type: object
      description: An access (JITA) request.
      properties:
        id:
          type: string
          example: 00000000000000000000000d
        _id:
          type: string
          example: 00000000000000000000000d
          description: Present on list responses (lean documents).
        system:
          type: object
          properties:
            id:
              type: string
              example: 00000000000000000000000b
            cn:
              type: string
              example: HOST01
            distinguishedName:
              type: string
            dNSHostName:
              type: string
        access_details:
          type: object
          properties:
            username:
              type: string
        requested_by:
          type: string
          example: 00000000000000000000000a
        requested_by_info:
          type: object
          additionalProperties: true
        request:
          type: object
          properties:
            type:
              type: string
              example: access
            strategy:
              type: string
              description: Internal worker strategy name.
            user:
              description: User id, or a populated user record on the expiring and overdue lists.
              oneOf:
              - type: string
              - $ref: '#/components/schemas/PlatformUser'
            accessViaGroup:
              type: string
            userInfo:
              type: object
              additionalProperties: true
            status:
              type: string
              enum:
              - pending
              - expiring
              - error
              - dismissed
              - completed
            created:
              type: string
              format: date-time
            start:
              type: string
              format: date-time
            expires:
              type: string
              format: date-time
            inProgress:
              type: boolean
            activity:
              type: array
              items:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  code:
                    type: integer
                    description: 0 means success; any other value is an error.
                  message:
                    type: string
        comment:
          type: string
        stale:
          type: boolean
        processed:
          type: string
          format: date-time
          nullable: true
        next_id:
          type: string
