  /config/ldaps:
    get:
      tags:
      - Configuration
      operationId: listLdapConfigs
      summary: List Active Directory domain configurations
      description: '**Required role:** any authenticated user (`user`, `admin`, `superadmin`).

        Unknown filter fields, and keys that start with `$`, are rejected with 400 `InvalidQuery`. Paging
        edge cases: `limit` above 1000 is clamped to 1000; `limit=0` or a non-numeric `limit` returns
        an empty page (not 400); `page` below 1 is treated as 1; a page past the end returns an empty
        array; an unknown `sort` field is ignored. `inlinePageInfo` wraps the body whatever its value
        (even `false`). Duplicate `name` values are allowed, so a `name` filter can return several records.

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/InlinePageInfoParam'
      responses:
        '200':
          description: A page of domain configurations.
          headers:
            X-Pagination-Count:
              $ref: '#/components/headers/X-Pagination-Count'
            X-Pagination-Max-Count:
              $ref: '#/components/headers/X-Pagination-Max-Count'
            X-Pagination-Page:
              $ref: '#/components/headers/X-Pagination-Page'
            X-Pagination-Pages:
              $ref: '#/components/headers/X-Pagination-Pages'
            X-Pagination-Total:
              $ref: '#/components/headers/X-Pagination-Total'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/CfgLdapConfig'
                - allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: '#/components/schemas/CfgLdapConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          description: Unknown filter field or an illegal key such as `$ne`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: InvalidQuery
                message: 'field "zzz": field name or value not allowed'
    post:
      tags:
      - Configuration
      operationId: createLdapConfig
      summary: Add an Active Directory domain
      description: 'Creates a domain configuration. The stored document requires `name`, `server`, `port`,
        `bind_dn`, `bind_pass`, `search_base` and the `domain`, `user` and `pass` of both `scan_config.read_acct`
        and `scan_config.write_acct`; a missing required field fails with 400. Passwords are stored encrypted.
        The optional `extra` object creates or updates the macOS domain service account in the same call.

        Returns HTTP 200 with a plain-text confirmation, not the created object. Read it back with `GET
        /config/ldaps`.

        Accepts JSON or `application/x-www-form-urlencoded` bodies.

        **Required role:** `admin` or `superadmin`.

        Domain names are not unique: posting the same `name` twice creates two records. The created record
        has empty `domain_fqdn` and `domain_netbios` until the first synchronization. A macOS account
        created through `extra` before that point is not returned by `GET /config/macos/domain` until
        the domain has synchronized. The confirmation body is `Successfully Added Domain` (text/html).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfgLdapWrite'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CfgLdapWrite'
      responses:
        '200':
          description: Created.
          content:
            text/html:
              schema:
                type: string
                example: Successfully Added Domain
        '400':
          description: Request validation failed (field length or range, or a required field is missing).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/ldaps/discover:
    post:
      tags:
      - Configuration
      operationId: discoverLdapServers
      summary: Discover domain controllers for a domain name
      description: 'Looks up the DNS SRV records `_ldap._tcp.dc._msdcs.<domain>` and returns the domain
        controllers sorted by priority, then weight, then name. `search_base` is derived from the domain
        name (`example.com` becomes `dc=example,dc=com`). `ssl` is true when the port is 636.

        A lookup failure still returns HTTP 200, with an `error` object instead of an array.

        Accepts JSON or `application/x-www-form-urlencoded` bodies.

        **Required role:** `admin` or `superadmin`.

        Any lookup problem, including a missing `domain`, returns HTTP 200 with `{error: {code, msg}}`.
        `code` is the DNS error name: `ENOTFOUND` (msg `Unable to connect to the host.`), otherwise the
        DNS error code such as `ENODATA` or `EBADNAME` with msg `Unable to discover details about your
        domain. (<code>)`; `DiscoverFail` is the fallback.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
                  description: DNS domain name to look up.
                  example: example.com
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - domain
              properties:
                domain:
                  type: string
      responses:
        '200':
          description: Array of discovered domain controllers, or an error object when the lookup failed.
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/CfgLdapDiscoveredServer'
                - $ref: '#/components/schemas/CfgDiscoverError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/ldaps/validate:
    post:
      tags:
      - Configuration
      operationId: validateLdapConfig
      summary: Test a bind to a domain controller without saving
      description: 'Tries to bind to the given server with the supplied credentials and search base. If
        `bind_pass` is not a string and `ldap_config_id` is given, the stored bind password of that domain
        is used. A failed test still returns HTTP 200, with `valid: false` and an `error` object (`code`
        and `msg`).

        Note this endpoint uses `host`, whereas saved configurations use `server`.

        Accepts JSON or `application/x-www-form-urlencoded` bodies.

        **Required role:** `admin` or `superadmin`.

        No field is rejected with 400. A missing `search_base` gives `NoSearchBase`; a missing `bind_dn`
        or password gives `MissingCredentials`; an unknown `ldap_config_id` gives `NoLdapConfig`; a malformed
        `ldap_config_id` gives an error whose `msg` starts with `Your configuration is not valid.`. All
        return HTTP 200 with `valid: false`. A successful bind returns `valid: true`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfgLdapValidateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CfgLdapValidateRequest'
      responses:
        '200':
          description: Test result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfgLdapValidateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/ldaps/{ldapId}:
    parameters:
    - name: ldapId
      in: path
      required: true
      description: Domain configuration id (24-character hex ObjectId). An unknown or malformed id returns
        404 (not 422) with the text/html body `Invalid Ldap ID`.
