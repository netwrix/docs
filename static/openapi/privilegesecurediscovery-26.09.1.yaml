      operationId: createEntraidConfig
      summary: Add a Microsoft Entra ID domain
      description: 'Creates an Entra ID tenant configuration. The stored document requires `name`, `client_id`,
        `tenant_id`, `client_secret` and the `domain`, `user` and `pass` of both `scan_config.read_acct`
