name: Slack notify PR activity

# Posts a Slack message to #docs-gh whenever a PR is created, has a review
# requested, or is commented on — @-mentioning the CODEOWNERS team(s) that
# own the changed files.

on:
  pull_request:
    types: [opened, review_requested]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: slack-notify-pr-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  notify:
    # issue_comment fires for both issue comments and PR comments — only
    # continue here when the comment is on a PR. Plain issue comments are
    # handled by the separate issue-intake workflow.
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Determine PR number
        id: pr-info
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "number=${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve CODEOWNERS teams for changed files
        id: resolve-teams
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh pr view ${{ steps.pr-info.outputs.number }} --repo ${{ github.repository }} --json files --jq '.files[].path')
          TEAMS=$(node scripts/resolve-codeowners-teams.mjs $(echo "$FILES" | tr '\n' ' '))
          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"

      - name: Build message
        id: build-message
        run: |
          # Build the notification text based on which event/action fired.
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "opened" ]; then
            MESSAGE="PR created: ${{ github.event.pull_request.html_url }}"
          elif [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.action }}" = "review_requested" ]; then
            MESSAGE="Review requested on PR #${{ steps.pr-info.outputs.number }}: ${{ github.event.pull_request.html_url }}"
          else
            MESSAGE="Comment on PR #${{ steps.pr-info.outputs.number }}: ${{ github.event.comment.html_url }}"
          fi
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          node scripts/notify-slack.mjs --message "${{ steps.build-message.outputs.message }}" --teams "${{ steps.resolve-teams.outputs.teams }}" || echo "Failed to send Slack notification"
