# Used by the local git hooks (scripts/vale-local.mjs). Same as .vale.ini plus
# DaleLocal: the Dale rules a pattern can catch. CI keeps .vale.ini and runs
# the full AI Dale pass, so DaleLocal stays out of the CI config.
StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Netwrix, DaleLocal
# Same as .vale.ini: bold UI labels and double-quoted product text are not the writer's to reword.
TokenIgnores = (\*\*[^*\n]+\*\*), ("[^"\n]+"), (\u201c[^\u201d\n]+\u201d)

[docs/kb/**/*.md]
BasedOnStyles = NetwrixKB
