<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>1Secure and Activity Monitor integration architecture</title>
<desc>1Secure in the cloud communicates in both directions with the Netwrix Cloud Agent on-premises. Several Activity Monitor agents send events to the Cloud Agent. Each agent receives events from file storage devices.</desc>
<style>
text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 500; }
.ts { font-size: 12px; font-weight: 400; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.purple rect { fill: #EEEDFE; stroke: #534AB7; stroke-width: 0.5; }
.purple .th { fill: #3C3489; }
.purple .ts { fill: #534AB7; }
.teal rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.5; }
.teal .th { fill: #085041; }
.teal .ts { fill: #0F6E56; }
.gray rect { fill: #F1EFE8; stroke: #5F5E5A; stroke-width: 0.5; }
.gray .th { fill: #444441; }
.lbl { fill: #5F5E5A; }
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="560" fill="#FFFFFF"/>

<rect x="20" y="100" width="650" height="410" rx="12" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="ts lbl" x="650" y="116" text-anchor="end" dominant-baseline="central">Customer on-premises environment</text>
<rect x="40" y="130" width="285" height="242" rx="8" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts lbl" x="305" y="355" text-anchor="end" dominant-baseline="central">Windows server</text>

<g class="purple">
<rect x="45" y="24" width="150" height="56" rx="8"/>
<text class="th" x="120" y="43" text-anchor="middle" dominant-baseline="central">1Secure</text>
<text class="ts" x="120" y="63" text-anchor="middle" dominant-baseline="central">SaaS in the cloud</text>
</g>
<line class="arr" x1="120" y1="82" x2="120" y2="160" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

<g class="purple">
<rect x="60" y="162" width="120" height="56" rx="8"/>
<text class="th" x="120" y="181" text-anchor="middle" dominant-baseline="central">Cloud Agent</text>
<text class="ts" x="120" y="201" text-anchor="middle" dominant-baseline="central">Links to 1Secure</text>
</g>
<g class="teal">
<rect x="195" y="162" width="110" height="56" rx="8"/>
<text class="th" x="250" y="181" text-anchor="middle" dominant-baseline="central">NAM Console</text>
<text class="ts" x="250" y="201" text-anchor="middle" dominant-baseline="central">Manages agents</text>
</g>
<g class="teal">
<rect x="60" y="270" width="120" height="56" rx="8"/>
<text class="th" x="120" y="289" text-anchor="middle" dominant-baseline="central">NAM Agent 1</text>
<text class="ts" x="120" y="309" text-anchor="middle" dominant-baseline="central">Same server</text>
</g>
<g class="teal">
<rect x="350" y="270" width="120" height="56" rx="8"/>
<text class="th" x="410" y="289" text-anchor="middle" dominant-baseline="central">NAM Agent 2</text>
<text class="ts" x="410" y="309" text-anchor="middle" dominant-baseline="central">Separate server</text>
</g>
<g class="teal">
<rect x="500" y="270" width="120" height="56" rx="8"/>
<text class="th" x="560" y="289" text-anchor="middle" dominant-baseline="central">NAM Agent 3</text>
<text class="ts" x="560" y="309" text-anchor="middle" dominant-baseline="central">Separate server</text>
</g>

<line class="arr" x1="95" y1="268" x2="95" y2="220" marker-end="url(#arrow)"/>
<path class="arr" d="M560 268 L560 248 L410 248"/>
<path class="arr" d="M410 268 L410 248 L145 248 L145 220" marker-end="url(#arrow)"/>

<g class="gray"><rect x="40" y="440" width="110" height="44" rx="8"/><text class="th" x="95" y="462" text-anchor="middle" dominant-baseline="central">NetApp 1</text></g>
<g class="gray"><rect x="165" y="440" width="110" height="44" rx="8"/><text class="th" x="220" y="462" text-anchor="middle" dominant-baseline="central">NetApp 2</text></g>
<g class="gray"><rect x="290" y="440" width="110" height="44" rx="8"/><text class="th" x="345" y="462" text-anchor="middle" dominant-baseline="central">NetApp 3</text></g>
<g class="gray"><rect x="415" y="440" width="110" height="44" rx="8"/><text class="th" x="470" y="462" text-anchor="middle" dominant-baseline="central">PowerScale 4</text></g>
<g class="gray"><rect x="540" y="440" width="110" height="44" rx="8"/><text class="th" x="595" y="462" text-anchor="middle" dominant-baseline="central">Qumulo 5</text></g>

<line class="arr" x1="95" y1="438" x2="100" y2="328" marker-end="url(#arrow)"/>
<line class="arr" x1="200" y1="438" x2="140" y2="328" marker-end="url(#arrow)"/>
<line class="arr" x1="240" y1="438" x2="400" y2="328" marker-end="url(#arrow)"/>
<line class="arr" x1="350" y1="438" x2="420" y2="328" marker-end="url(#arrow)"/>
<line class="arr" x1="485" y1="438" x2="540" y2="328" marker-end="url(#arrow)"/>
<line class="arr" x1="595" y1="438" x2="580" y2="328" marker-end="url(#arrow)"/>

<g class="purple"><rect x="40" y="532" width="12" height="12" rx="2"/></g>
<text class="ts lbl" x="58" y="538" dominant-baseline="central">1Secure components</text>
<g class="teal"><rect x="210" y="532" width="12" height="12" rx="2"/></g>
<text class="ts lbl" x="228" y="538" dominant-baseline="central">Activity Monitor</text>
<g class="gray"><rect x="360" y="532" width="12" height="12" rx="2"/></g>
<text class="ts lbl" x="378" y="538" dominant-baseline="central">File storage devices</text>
</svg>
