  /queue/pending/{systemId}:
    get:
      tags:
      - Queue
      operationId: getPendingQueueItemForSystem
      summary: Get the caller's open request for a system
      description: 'Returns the calling user''s queue item for the system whose status is `pending` or

        `expiring`, if one exists. Returns 204 with no body when there is none. Always scoped to the

        caller, including for admins.


        **Required role:** any authenticated user.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: systemId
        in: path
        required: true
        description: Object id of the system.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      responses:
        '200':
          description: The open queue item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueueItem'
        '204':
          description: The caller has no pending or expiring request on that system.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: The id is not a valid object id. Typed error body `UnprocessableEntityError`. A
