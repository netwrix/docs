          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          description: 'Invalid `default_system_config.policies.offline_access_management`: `enabled`
            must be sent as a boolean when that object is sent, and `strategy` must be `os-best-practice`,
            `managed-built-in` or `custom`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: UnprocessableEntityError
                message: Parameter "strategy" must be either "os-best-practice", "managed-built-in", or
                  "custom"
    delete:
      tags:
      - Configuration
      operationId: deleteLdapConfig
      summary: Delete an Active Directory domain configuration
      description: 'Deletes the domain configuration and its macOS domain service-account configuration.
        Returns the deleted configuration.

        **Required role:** `admin` or `superadmin`.

