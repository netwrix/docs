name: Slack Notify Issue

# Posts a Slack message to #docs-gh whenever an Issue is created or commented on,
# @-mentioning the relevant CODEOWNERS team members.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

concurrency:
  group: slack-notify-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: read

jobs:
  notify:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Determine codeowner teams
        id: codeowners
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # Fetch current labels from the issue. Labels may not be applied yet
          # (auto-labeling runs asynchronously), so an empty result here just
          # means no team mention — it does not skip the notification itself.
          LABELS=$(gh issue view ${{ github.event.issue.number }} --repo ${{ github.repository }} --json labels --jq '.labels[].name')

          # Skip for KB Operations tracking issues (any kb/ label)
          if echo "$LABELS" | grep -q "^kb/"; then
            echo "Issue has kb/ label — skipping Slack notification"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Skip for Admin Support PR review tracking issues
          if echo "$ISSUE_TITLE" | grep -q "^Admin: PR review"; then
            echo "Admin Support tracking issue — skipping Slack notification"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Read the mapping file
          MAPPING=$(cat .github/label-codeowners.json)

          # Collect matched teams (deduplicated), comma-joined
          TEAMS=""
          while IFS= read -r label; do
            team=$(echo "$MAPPING" | jq -r --arg l "$label" '.[$l] // empty')
            if [ -n "$team" ]; then
              if ! echo "$TEAMS" | grep -qF "$team"; then
                TEAMS="${TEAMS:+$TEAMS,}$team"
              fi
            fi
          done <<< "$LABELS"

          echo "teams=$TEAMS" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        if: steps.codeowners.outputs.skip != 'true'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NOTIFY_TEAMS: ${{ steps.codeowners.outputs.teams }}
        run: |
          if [ "${{ github.event_name }}" = "issues" ]; then
            MESSAGE="Issue created: ${{ github.event.issue.html_url }}"
          else
            MESSAGE="Comment on Issue #${{ github.event.issue.number }}: ${{ github.event.comment.html_url }}"
          fi

          node scripts/notify-slack.mjs --message "$MESSAGE" --teams "$NOTIFY_TEAMS" || echo "Failed to send Slack notification"
