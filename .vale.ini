StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Netwrix
# Text the writer must reproduce exactly is not theirs to reword: bold UI labels (the style guide bolds
# UI elements) and double-quoted product text such as error messages. Rules skip both.
TokenIgnores = (\*\*[^*\n]+\*\*), ("[^"\n]+"), (\u201c[^\u201d\n]+\u201d)

[docs/kb/**/*.md]
BasedOnStyles = NetwrixKB
