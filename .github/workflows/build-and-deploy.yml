name: Build and deploy Docusaurus site to Azure Blob Storage

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
    steps:
      - name: Determine environment
        id: set-env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

  # Build and deploy share one job so the 1.5 GB build/ directory never makes a
  # round trip through the artifact store. Handing it between two jobs cost about
  # 4.5 minutes (1.5 min upload + 3 min download) purely in transfer.
  build-and-deploy:
      runs-on: gh-runner-large
      needs: determine-environment
      environment: ${{ needs.determine-environment.outputs.environment }}
      permissions:
        contents: read
      env:
        APP_EXTERNAL_URL: ${{ secrets.APP_EXTERNAL_URL || vars.APP_EXTERNAL_URL }}
      steps:
        - name: Check out source code
          uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

        - name: Set up Node.js
          uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
          with:
            node-version: '22.x'

        - name: Get npm cache directory
          id: npm-cache-dir
          run: echo "dir=$(npm config get cache)" >> $GITHUB_OUTPUT

        - name: Cache Node.js dependencies
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
            path: ${{ steps.npm-cache-dir.outputs.dir }}
            key: v2-${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              v2-${{ runner.os }}-node-

        # Rspack's persistent cache (future.faster.rspackPersistentCache) and the
        # MDX cross-compiler cache both live here, and this is the cache that
        # actually shortens a rebuild. The key carries github.run_id so every run
        # misses on the exact key and therefore *saves* a refreshed cache, while
        # restore-keys pull the newest previous one. Keying on package-lock.json
        # alone (the previous behaviour) meant the first run saved a cache that
        # then hit forever and never picked up newly compiled modules.
        #
        # The former `.docusaurus` cache was dropped: its key hashed docs/**, so
        # any content change missed it, and the restore-keys fallback just
        # restored a stale directory that Docusaurus regenerates anyway.
        - name: Cache Rspack/MDX compiler output
          uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
            path: node_modules/.cache
            key: v3-${{ runner.os }}-rspack-${{ hashFiles('**/package-lock.json') }}-${{ github.run_id }}
            restore-keys: |
              v3-${{ runner.os }}-rspack-${{ hashFiles('**/package-lock.json') }}-
              v3-${{ runner.os }}-rspack-

        - name: Install dependencies and build site
          run: |
            npm ci
            npm run ci
          env:
            NODE_OPTIONS: "--max-old-space-size=16384"
            NODE_ENV: ${{ needs.determine-environment.outputs.environment }}

        # PR runs stop before the deploy steps below, so the built site is only
        # reachable as an artifact. Kept PR-only: on push the build is deployed,
        # and uploading 1.5GB there cost ~4.5min for nothing.
        - name: Upload artifact for deployment
          if: github.event_name == 'pull_request'
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: build-output
            path: build/

        # Installed into the job's temp dir and put on PATH, so this needs no
        # sudo. The self-hosted runner's sudo availability is not something the
        # workflow should depend on.
        - name: Install azcopy
          if: github.event_name != 'pull_request'
          run: |
            mkdir -p "$RUNNER_TEMP/azcopy"
            curl -fsSL -o "$RUNNER_TEMP/azcopy/azcopy.tar.gz" https://aka.ms/downloadazcopy-v10-linux
            tar -xf "$RUNNER_TEMP/azcopy/azcopy.tar.gz" -C "$RUNNER_TEMP/azcopy" --strip-components=1
            echo "$RUNNER_TEMP/azcopy" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/azcopy/azcopy" --version

        # The SAS token is minted with the storage SDK already in node_modules,
        # so the Azure CLI is no longer installed on the runner at all.
        - name: Upload to Azure Blob Storage with AzCopy
          if: github.event_name != 'pull_request'
          env:
            STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
            STORAGE_ACCOUNT_KEY: ${{ secrets.STORAGE_ACCOUNT_KEY }}
          run: |
            echo "Deploying to ${{ needs.determine-environment.outputs.environment }} environment"
            echo "Starting sync of changed files..."

            sas_token=$(node scripts/mint-container-sas.mjs --container '$web' --hours 2 --permissions dlrw)

            azcopy sync "./build/" \
              "https://${STORAGE_ACCOUNT_NAME}.blob.core.windows.net/\$web?${sas_token}" \
              --delete-destination=true \
              --log-level=INFO \
              --cap-mbps=0 \
              --block-size-mb=4

            echo "Sync completed!"

        # Folds together two steps that each walked the whole container: a per-blob
        # `az storage blob metadata update` loop (~0.6s of CLI cold start each, 20 at
        # a time, ~47 minutes for the site's ~86k blobs) and 19 `az storage blob
        # update-batch` calls, one per extension. The script lists metadata and
        # properties inline with the blob listing and writes only what is absent or
        # stale. Pass --force to rewrite every blob unconditionally.
        - name: Set public URL metadata and content types on blobs
          if: github.event_name != 'pull_request'
          env:
            STORAGE_ACCOUNT_NAME: ${{ secrets.STORAGE_ACCOUNT_NAME }}
            STORAGE_ACCOUNT_KEY: ${{ secrets.STORAGE_ACCOUNT_KEY }}
          run: |
            if [[ -z "$APP_EXTERNAL_URL" ]]; then
              echo "APP_EXTERNAL_URL not configured, skipping blob metadata"
              exit 0
            fi

            node scripts/set-blob-metadata.mjs --container '$web'

        - name: Purge CDN endpoint (if configured)
          if: github.event_name != 'pull_request'
          run: |
            if [[ -n "${{ secrets.CDN_ENDPOINT_NAME }}" ]] && [[ -n "${{ secrets.CDN_PROFILE_NAME }}" ]] && [[ -n "${{ secrets.CDN_RESOURCE_GROUP }}" ]]; then
              echo "Note: CDN purge requires Azure login. Skipping CDN purge when using storage key authentication."
              echo "To use CDN purge, you'll need to use Azure AD authentication or purge CDN manually."
            else
              echo "CDN configuration not found, skipping CDN purge."
            fi

        - name: Display deployment URL
          if: github.event_name != 'pull_request'
          run: |
            echo "Deployment complete!"
            echo "Environment: ${{ needs.determine-environment.outputs.environment }}"
            echo "URL: https://${{ secrets.STORAGE_ACCOUNT_NAME }}.z13.web.core.windows.net"
            if [[ -n "${{ secrets.CUSTOM_DOMAIN }}" ]]; then
              echo "Custom Domain: ${{ secrets.CUSTOM_DOMAIN }}"
            fi
            echo "All files deployed with proper MIME types for optimal browser compatibility!"
