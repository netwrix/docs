                $ref: '#/components/schemas/ErrorTyped'
  /queue/{queueId}:
    parameters:
    - name: queueId
      in: path
      required: true
      description: Object id of the queue item.
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{24}$
    put:
      tags:
      - Queue
      operationId: dismissQueueItem
      summary: Dismiss a failed expiring queue item
      description: 'Dismisses an overdue queue item so it stops being reported. Only one change is supported:

        set `request.status` to `dismissed`. The item must be `expiring`, past its expiry time, and

        its latest activity entry must be an error (nonzero code). The body may be JSON or

        form-encoded; the key is the literal string `request.status` (a flat key, not a nested

        object).


        **Required role:** `admin` or `superadmin`.


        A nested JSON object (`{"request": {"status": "dismissed"}}`) is not understood and returns 501.
        A second dismissal of the same item returns 403 because it is no longer `expiring`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformQueueDismiss'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformQueueDismiss'
      responses:
        '200':
          description: The dismissed queue item.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformQueueItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The item is not an expiring item past its expiry time, or the caller lacks the
            role.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '501':
          description: '`request.status` is not `dismissed`, or the latest activity entry is not an error.
            Empty body.'
  /config/entraid-domains:
