      description: 'Merges the supplied fields into the stored proxy configuration and saves it. Only
        `protocol`, `host`, `port`, `verify_ssl`, `auth.username` and `auth.password` are read; other
        fields are ignored. After the merge the resulting configuration must have a valid `protocol`,
        `host` and `port`. A leading `http://` or `https://` on `host` is stripped. Any update that includes
        `protocol`, `host` or `port` but omits `auth` (or sends an empty `auth`) removes the stored credentials.
        Resend `auth.username` and `auth.password` with every such change. A body containing only `verify_ssl`
        keeps them. If `auth` is present, both `username` and `password` must be non-empty. Credentials
        are stored encrypted.

        Accepts JSON or `application/x-www-form-urlencoded` bodies.

        **Required role:** `admin` or `superadmin`.

        `port` is any non-empty string or number (a number is cast to a string); it is not range-checked,
        so `"0"` and `"abc"` are accepted and `Invalid Port` is returned only when the merged port is
        empty or missing. `verify_ssl` alone fails with 422 `Invalid Protocol` when no proxy is stored
        yet. The response includes `updatedAt`, and `createdAt` and `__v` only on the call that creates
        the document. A flat form key such as `auth.username=x` (instead of `auth[username]=x`) returns
        500 after the other fields are saved; use JSON or bracketed keys.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfgProxyUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CfgProxyUpdate'
      responses:
        '200':
          description: The saved proxy configuration (password omitted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfgProxyConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: 'Invalid proxy configuration. Messages include `Invalid proxy configuration` (no
            recognised fields), `Invalid Protocol`, `Invalid Host`, `Invalid Port` and `Invalid authentication
            credentials`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '500':
          description: A flat form key such as `auth.username` (instead of `auth[username]`) fails after
            the other fields have already been saved, so the stored proxy configuration is partly updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /config/proxy/validate:
    post:
      tags:
      - Configuration
      operationId: validateProxyConfig
      summary: Test a proxy configuration without saving it
      description: 'Merges the supplied fields over the stored configuration in memory, then sends an
        HTTP HEAD request through that proxy to a test URL and reports whether a 2xx response came back.
        Nothing is saved. The body has the same fields and rules as `PATCH /config/proxy`. A body that
        includes `protocol`, `host` or `port` but omits `auth` (or sends an empty `auth`) is tested without
        the stored credentials. A body containing only `verify_ssl` keeps them.

        A failed connection test still returns HTTP 200 with `success: false`.

        **Required role:** `admin` or `superadmin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CfgProxyUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CfgProxyUpdate'
      responses:
        '200':
          description: Result of the connection test.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfgProxyValidateResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Invalid proxy configuration (same messages as `PATCH /config/proxy`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /config/radius:
    get:
      tags:
      - Configuration
      operationId: getRadiusConfig
      summary: Get the RADIUS second-factor configuration
      description: 'Returns the RADIUS server settings. The shared secret is never returned.

        **Required role:** `admin` or `superadmin`.

        On an installed system the document exists in its default state: `{id, server: "", port: null,
        enabled: false, timeout: 30000}`, without `createdAt` or `updatedAt`. The body is JSON `null`
        only if the document has been removed.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The RADIUS configuration, or `null`.
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                - $ref: '#/components/schemas/CfgRadiusConfig'
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/server/certificate:
    get:
      tags:
      - Configuration
      operationId: getServerCertificate
      summary: Get metadata of the server TLS certificate
      description: 'WARNING: This endpoint manages the TLS certificate of the Netwrix Privilege Secure
        for Discovery server itself. Changing it can interrupt access to the console and API.

        Returns metadata about the current (and previous, if any) server TLS certificate. The private
        key and the certificate PEM are never returned. HTTP 404 with an empty body means no certificate
        has been uploaded.

        **Required role:** `admin` or `superadmin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Certificate metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfgServerCertificate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No server certificate has been stored. The body is empty (Content-Type is still
            application/json).
  /config/sso:
    get:
      tags:
      - Configuration
      operationId: getSsoConfig
      summary: Get the SAML single sign-on configuration
      description: 'Returns the SAML SSO settings. If none exist yet, a default (disabled) document is
        created and returned.

        **Required role:** `admin` or `superadmin`.

        The response to the call that creates the default document includes `type: "saml_config"` and
        `__v`; later reads omit `type`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The SSO configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CfgSsoConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/integrations/edr/bulk-scans:
    get:
      tags:
      - Configuration - EDR integrations
      operationId: listEdrBulkScans
      summary: List bulk scans
      description: 'Returns bulk scan summaries, newest first by `start_time`. This endpoint has its own
        paging and always wraps the

        result as `{docs, page, pages, total, limit}`; no `X-Pagination-*` headers. Paging uses `page`
        and `limit`.

        When `limit` is omitted it is 100 (the maximum). A `limit` above 100 is clamped to 100, and a
        `limit` that is 0,

        negative or not a number falls back to 25. A `page` below 1 or not a number is treated as 1, and
        a page past the

        end returns an empty `docs` array. `status` is upper-cased by the server; an unrecognised value
        is not rejected and

        matches nothing (200 with an empty `docs` array). An unparsable `startDate` or `endDate` is ignored
        rather than

        rejected. `end_time` and `duration_seconds` are omitted from a

        summary that has not recorded them.

        **Required role:** `superadmin` or `admin`.'
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 100
      - name: status
        in: query
        description: Filter by scan status. Case-insensitive; upper-cased by the server.
        schema:
          type: string
          enum:
          - COMPLETED
          - PARTIAL
          - FAILED
      - name: startDate
        in: query
        description: Only scans that started at or after this time.
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Only scans that started at or before this time.
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: A page of bulk scan summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: '#/components/schemas/EdrBulkScan'
                  page:
                    type: integer
                  pages:
                    type: integer
                  total:
                    type: integer
                  limit:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/integrations/edr/bulk-scans/status/current:
    get:
      tags:
      - Configuration - EDR integrations
      operationId: getCurrentEdrBulkScan
      summary: Get the running bulk scan
      description: 'Reports whether a bulk scan job is running now.

        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current scan state.
          content:
            application/json:
              schema:
                type: object
                required:
                - in_progress
                - current_scan
                properties:
                  in_progress:
                    type: boolean
                  current_scan:
                    type: object
                    nullable: true
                    properties:
                      job_id:
                        type: string
                      started_at:
                        type: string
                        format: date-time
                      elapsed_seconds:
                        type: integer
                      info:
                        type: object
                        properties:
                          group_name:
                            type: string
                          scheduled_task_id:
                            type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /config/integrations/edr/bulk-scans/{id}:
    get:
      tags:
      - Configuration - EDR integrations
      operationId: getEdrBulkScan
      summary: Get a bulk scan
      description: 'Returns one bulk scan summary with detail fields. `{id}` is the `bulk_scan_id` value,
        not a database id.

        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: The `bulk_scan_id` of the scan.
        schema:
          type: string
      responses:
        '200':
          description: The bulk scan.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/EdrBulkScan'
                - type: object
                  properties:
                    unmatched_hostnames:
                      type: array
                      items:
                        type: string
                    retry_summary:
                      type: object
                      nullable: true
                      additionalProperties: true
                      description: Summary of the retry outcome. Null when no retry summary is available
                        for the scan.
                    timing_breakdown:
                      type: object
                      nullable: true
                      additionalProperties: true
                      description: Timing breakdown. Normally null; per-phase timings are in `metrics.timing_ms`.
                    error:
                      type: string
                      nullable: true
                      description: Error recorded for a failed scan. Always present on this endpoint;
                        null when the scan recorded no error.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No scan with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /config/integrations/edr/configurations:
    get:
      tags:
      - Configuration - EDR integrations
      operationId: listEdrConfigurations
      summary: List EDR configurations
      description: 'Returns every active EDR configuration as a plain JSON array (not paged, no pagination
        headers).

        Soft-deleted configurations are omitted. Configurations with provider `tanium_cloud` are returned

        only when the `tanium_cloud` release toggle is enabled. Secrets are never returned.

        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Active EDR configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EdrConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Configuration - EDR integrations
      operationId: createEdrConfiguration
      summary: Create an EDR configuration
      description: 'Creates a configuration for one provider. The `provider` property selects the schema.

        Send the body as JSON.


        When `config.integration.enabled` is true the endpoint requires a valid base URL and credentials

        for the provider, and returns 422 otherwise. When `config.investigation.enabled` is true a valid

        `config.investigation.base_url` is required, and the 422 message names the "API Base URL". A request
        without a

        recognized `provider` returns 422. When `config.integration.use_proxy` is true and `enabled` is
        true, a missing or invalid proxy configuration returns 409. `name` is required; a missing name,
        or a value that fails validation (for

        example `name` or `base_url` over 255 characters, `api_token` over 1024 characters, a non-boolean
        `enabled`, an

        unparsable Tanium `tokenExpiresAt`), returns 400. Names are not required to be unique: a second
        configuration with

        the same `name` is created with 201. Release note: the product intends to reject duplicate active
        names with 409, but that check does not run for provider configurations, so duplicates are accepted.

        **Required role:** `superadmin` or `admin`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdrConfigurationRequest'
            examples:
              crowdstrike:
                summary: CrowdStrike Falcon
                value:
                  provider: crowdstrike_falcon
                  name: CrowdStrike production
                  config:
                    integration:
                      enabled: true
                      base_url: https://api.example.com
                      use_proxy: false
                      credentials:
                        api:
                          client_id: <client-id>
                          client_secret: <client-secret>
                    investigation:
                      enabled: false
      responses:
        '201':
          description: Created. The body is a confirmation string, not the new object.
          content:
            text/html:
              schema:
                type: string
                example: Successfully Created New EDR Configuration
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/integrations/edr/configurations/validate:
    post:
      tags:
      - Configuration - EDR integrations
      operationId: validateEdrConfiguration
      summary: Test an EDR connection
      description: 'Tests the integration settings against the provider ("Test Connection"). The body
        has the same

        shape as create, and `provider` is always required (a missing or unknown `provider` returns 422,
        even with `_id`).

        Include `_id` of an existing configuration, together with its `provider`, to reuse its stored
        secrets for values

        the body omits; omit `_id` to test an unsaved configuration. A malformed `_id` returns 422. Only
        `config.integration`

        is tested. If the body has no `config.integration`, the response is 200 with an empty body. The
        body is not

        schema-validated (no 400 for wrong types).


        The HTTP status is 200 whether or not the connection works; read `success` (or the per-API flags

        for Carbon Black Cloud) and `messages` in the body. Invalid input returns 422, an unusable proxy
        returns 409.

        **Required role:** `superadmin` or `admin`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/EdrConfigurationRequest'
              - type: object
                properties:
                  _id:
                    $ref: '#/components/schemas/PlatformObjectId'
      responses:
        '200':
          description: Test outcome.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/EdrValidationResult'
                - $ref: '#/components/schemas/EdrValidationResultCarbonBlack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /config/integrations/edr/configurations/{id}:
    parameters:
    - $ref: '#/components/parameters/EdrConfigurationId'
    get:
      tags:
      - Configuration - EDR integrations
      operationId: getEdrConfiguration
      summary: Get an EDR configuration
      description: 'Returns one configuration by id, including a soft-deleted one. Secrets are never returned.

        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdrConfigurationResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No configuration with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          description: Malformed id. The server returns a typed error, not a plain-text 404.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
    patch:
      tags:
      - Configuration - EDR integrations
      operationId: updateEdrConfiguration
      summary: Update an EDR configuration
      description: 'Merges the supplied `config.integration` and `config.investigation` values into the
        stored

        configuration. The provider cannot be changed; the stored provider is used and any `provider`
        in the body is ignored

        (it may be omitted). Omitted secrets keep their stored values. Send the body as JSON. An empty
        body, or a body without `config`, succeeds and changes nothing

        except `name` when supplied. A `config.integration` object that carries no recognised settings
        (after zero-valued Tanium options are dropped) returns 422. Array settings (`domain_fallback_list`,
        `bulk_single_device_retry_statuses`) are merged

        element by element with the stored array, so a shorter array cannot shrink the stored one and
        an empty array changes

        nothing.


        For `tanium_cloud` the body may also carry `tokenExpiresAt` (ISO 8601 date-time or null). For

        `sentinelone` the API token expiry is refreshed from the vendor after a save; a failure there
        is ignored.

        The same 400, 409 and 422 conditions as create apply.

        **Required role:** `superadmin` or `admin`.'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdrConfigurationRequest'
      responses:
        '200':
          description: The updated configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EdrConfigurationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No configuration with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      tags:
      - Configuration - EDR integrations
      operationId: deleteEdrConfiguration
      summary: Delete an EDR configuration
      description: 'Soft-deletes the configuration: `active` becomes false and the name is renamed to

        `<name>_deleted_<unix-ms>` so the name can be reused. Deleting an already deleted configuration

        succeeds with no further change. Returns 409 when a domain (LDAP or Microsoft Entra ID) or a

        system still uses the configuration.

        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Outcome of the soft delete.
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    $ref: '#/components/schemas/PlatformObjectId'
                  name:
                    type: string
                  active:
                    type: boolean
                    example: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No configuration with this id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'JWT access token from `POST /login` or `POST /api-keys/auth`, sent as `Authorization:
        Bearer <access-token>`.

        The server also accepts the token in the `x-access-token` header (and `token` in the body or query
        string),

        but the Authorization header is preferred. Roles are `superadmin`, `admin` and `user`; each operation
        lists

        the role it needs.

        '
  parameters:
    LimitParam:
      name: limit
      in: query
      description: 'Page size. Default 100, maximum 1000. A value above 1000 is clamped to 1000. A value
        below 1, a negative value or a non-numeric value is not rejected: it gives a page size of 0 and
        an empty result (the headers still report the total). A fractional value is truncated.'
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    PageParam:
      name: page
      in: query
      description: Page number, starting at 1. A value below 1 or a non-numeric value is treated as 1.
        A page past the last one returns 200 with an empty result and the requested page number in `X-Pagination-Page`.
      schema:
        type: integer
        minimum: 1
        default: 1
    SortParam:
      name: sort
      in: query
      description: 'Field to sort by. Prefix with `-` for descending order, for example `-sAMAccountName`.
        The sort is ignored when `advanced` is active on the same request: rows come back in storage order.'
      schema:
        type: string
    InlinePageInfoParam:
      name: inlinePageInfo
      in: query
      description: 'When present (any value), the response body is wrapped as `{limit, page, pages, total,
        links, docs}` instead

        of a bare array. The `X-Pagination-*` headers are sent either way.

        '
      schema:
        type: string
    AdvancedParam:
      name: advanced
      in: query
      description: 'Boolean flag (`?advanced`, `advanced=`, `advanced=true`; `advanced=false` turns it
        off). When present on an

        endpoint that supports advanced search (`GET /computers`, `GET /groups`), the other filter

        parameters use the advanced query-string syntax and `select` becomes available. Keys beginning
        with `$` in the

        query, body or path parameters are rejected with 400 `InvalidQuery`. Endpoints without advanced
        search ignore it.

        '
      allowEmptyValue: true
      schema:
        type: boolean
    SelectParam:
      name: select
      in: query
      description: 'Comma-separated list of fields to return. Honored only together with `advanced` on
        endpoints that support

        advanced search; elsewhere it is treated as a filter field and the request fails with 400 `InvalidQuery`.

        '
      schema:
        type: string
    ComputersComputerIdParam:
      name: computerId
      in: path
      required: true
      description: Computer object id. An id that does not exist (or is malformed) returns a plain-text
        404 `Invalid Computer ID`.
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
        example: 00000000000000000000000a
    CompAccessDuration:
      name: t
      in: query
      required: false
      description: Session length in minutes. Positive integer up to the configured maximum (default 240).
        Values above the maximum, negative values, or non-integers such as `1.5` return 400; absent, empty,
        `0`, or non-numeric values (`abc`) use the default.
      schema:
        type: integer
        minimum: 1
        default: 240
    CompAccessComment:
      name: comment
      in: query
      required: false
      description: Free-text justification stored on the access request.
      schema:
        type: string
    CompAccessTargetUserId:
      name: userId
      in: query
      required: false
      description: Object id of the user the request is for. Defaults to the caller. A value other than
        the caller makes it an on-behalf request, which requires role `admin`.
      schema:
        type: string
        pattern: ^[0-9a-f]{24}$
    EdrConfigurationId:
      name: id
      in: path
      required: true
      description: Database id of the EDR configuration (24 hex characters). A malformed id returns 422
        with a typed error body.
      schema:
        $ref: '#/components/schemas/PlatformObjectId'
  headers:
    X-Pagination-Count:
      description: Number of records in this page.
      schema:
        type: integer
    X-Pagination-Max-Count:
      description: Page size used for the request (`limit`).
      schema:
        type: integer
    X-Pagination-Page:
      description: Current page number.
      schema:
        type: integer
    X-Pagination-Pages:
      description: Total number of pages.
      schema:
        type: integer
    X-Pagination-Total:
      description: Total number of records matching the query.
      schema:
        type: integer
    Link:
      description: 'RFC 8288 links with `rel` values `first`, `last`, and, when they exist, `prev` and
        `next`.

        '
      schema:
        type: string
  responses:
    Unauthorized:
      description: 'No token, or the token is invalid or expired. The body is `{message}`: `No auth token
        provided` when no token is sent, otherwise the token check''s message (`jwt expired`, `jwt malformed`,
        `invalid signature`, `invalid token`, `jwt signature is required`). Send `Authorization: Bearer
        <token>` exactly: the server drops the first seven characters of the header and reads the rest
        as the token, so a different scheme or an extra space fails. If `Authorization` is absent, the
        server reads a `token` field in the body, then a `token` query parameter, then `x-access-token`.
        Routes that validate query fields reject `?token=` with 400 `InvalidQuery`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
          example:
            message: No auth token provided
    Forbidden:
      description: 'The token''s role is not allowed for this operation, or the token''s scopes exclude
        the route

        (`Scope not allowed by token`).

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTyped'
          example:
            name: Forbidden
            message: User does not have access to this resource.
    NotFoundText:
      description: No record has the `:id` in the path (the id is malformed or unknown). The body is the
        bare text `Invalid <Type> ID` (for example `Invalid Computer ID`, `Invalid User ID`) with Content-Type
        `text/html; charset=utf-8`, not JSON. Some routes return an empty body.
      content:
        text/html:
          schema:
            type: string
    Unprocessable:
      description: 'The request could not be processed, for example an id that is not a valid object id.

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTyped'
          example:
            name: UnprocessableEntityError
            message: 'Invalid Computer ID: "123"'
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTyped'
    CompAccessRequested:
      description: Access request queued.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CompSessionResult'
          example:
            id: 00000000000000000000000a
            message: Session requested.
    CompBadRequest:
      description: 'Bad request. Access routes: `InvalidQuery` ''Invalid Access Duration Requested.''
        for a bad `t`. Any route: `InvalidQuery` ''illegal key "$ne" in query|body'' when a query or body
        key starts with `$`. Malformed JSON gives an untyped `{error}` body. Sudoers routes: `BadRequestError`
        for a non-Linux computer, a missing or empty `sudoers_blob`, or a missing `sudoersHash`. Admin
        add/remove on Linux: `BadRequestError` carrying the sudoers service message. Missing or malformed
        ids on the admin routes are 422, not 400.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTyped'
    CompAccessConflict:
      description: Access is already requested (`Access has already been requested to this computer.`)
        or already granted (`Access has already been granted to this computer.`); `context` holds the
        existing request `id` and `expires`. Also returned, without `context`, when the token lacks the
        caller's encoded password for a macOS or directory-bridged Linux computer (`Missing encpass in
        token for access request.`).
      content:
        application/json:
          schema:
            allOf:
            - $ref: '#/components/schemas/ErrorTyped'
            - type: object
              properties:
                context:
                  type: object
                  properties:
                    id:
                      type: string
                      example: 00000000000000000000000a
                    expires:
                      type: string
                      format: date-time
    CompSudoersServiceError:
      description: Failure reported by the sudoers service, passed through with that service's HTTP status
        and a `{message}` body. A 500 is returned when the service fails unexpectedly (a missing Linux
        service-account password, or a non-string `sudoers_blob`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorMessage'
    BadRequest:
      description: Validation failed (for example a value over its maximum length or of the wrong type).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorTyped'
  schemas:
    ErrorTyped:
      type: object
      description: Typed error. Most validation and business-rule errors use this shape.
      properties:
        name:
          type: string
          description: Error class, for example `Forbidden`, `BadRequestError`, `ConflictError`, `UnprocessableEntityError`.
        message:
          type: string
        context:
          description: Extra detail about the failure. Omitted when empty.
        code:
          type: string
          description: Machine-readable code. Omitted when empty.
    ErrorSimple:
      type: object
      description: Fallback error for unexpected failures.
      properties:
        error:
          type: string
      required:
      - error
    ErrorMessage:
      type: object
      description: Error with only a message. Used for authentication failures and some endpoint-specific
        errors.
      properties:
        message:
          type: string
      required:
      - message
    PagedEnvelope:
      type: object
      description: 'List body when `inlinePageInfo` is sent. Without it the body is the bare array of
        records. Compose with a

        `docs` array of the record type.

        '
      properties:
        limit:
          type: integer
        page:
          type: integer
        pages:
          type: integer
        total:
          type: integer
        links:
          type: object
          properties:
            first:
              type: string
              format: uri
            last:
              type: string
              format: uri
            prev:
              type: string
              format: uri
            next:
              type: string
              format: uri
        docs:
          type: array
          items: {}
    AuthLoginRequest:
      type: object
      properties:
        username:
          type: string
          description: sAMAccountName, or `secureone` for the built-in service account.
        domain:
          type: string
          description: Domain NetBIOS name. Omit for the built-in service account.
        password:
          type: string
          format: password
        code:
          type: string
          description: Second-factor one-time code (RADIUS password or six-digit TOTP code).
        key:
          type: string
          description: Base32 TOTP secret returned with `2FA_Config_Required`. Send it back together with
            `code` to finish enrollment.
    AuthLoginSuccess:
      type: object
      required:
      - message
      - token
      - expires
      properties:
        message:
          type: string
          example: Access granted.
        token:
          type: string
          description: JWT access token.
        expires:
          type: string
          format: date-time
          description: Token expiry. The lifetime is configurable, default 10 hours.
    AuthLoginEnrollmentRequired:
      type: object
      required:
      - message
      - key
      - code
      properties:
        message:
          type: string
        key:
          type: string
          description: New base32 TOTP secret to add to an authenticator app.
        code:
          type: string
          enum:
          - 2FA_Config_Required
    AuthLoginTokenRequired:
      type: object
      required:
      - message
      - code
      properties:
        message:
          type: string
        code:
          type: string
          enum:
          - 2FA_Token_Required
    AuthApiKey:
      type: object
      properties:
        id:
          type: string
          description: Object id.
          example: 00000000000000000000000a
        appId:
          type: string
          format: uuid
          description: Key identifier used by `DELETE /api-keys/{appId}`. It is the `jti` of the key JWT.
        appName:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
            - system:register
            - system:ground_station
        linkedUsers:
          type: array
          items:
            type: string
          description: Object ids of the users whose role an access token takes.
        createdBy:
          type: string
          description: Object id of the user who created the key.
        isRevoked:
          type: boolean
        revokedBy:
          type: string
          description: Object id of the user who revoked the key. For a key revoked by the built-in `secureone`
            account this is the service account's id. Absent until the key is revoked.
        lastAccessed:
          type: string
          format: date-time
          description: Time the key was last exchanged for an access token. Set to the creation time when
            the key is created.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        _id:
          type: string
          description: Object id. The same value as `id`.
          example: 00000000000000000000000a
        __v:
          type: integer
          description: Internal document version counter.
    AuthApiKeyCreateRequest:
      type: object
      required:
      - appName
      properties:
        appName:
          type: string
          description: Unique name for the key.
        linkedUsers:
          type: array
          items:
            type: string
          description: Object ids of existing users. Send at least one, otherwise the key cannot authenticate.
        scopes:
          type: array
          items:
            type: string
            enum:
            - system:register
            - system:ground_station
          description: Restricts the access tokens issued from this key. Empty or omitted means unrestricted.
    AuthApiKeyCreated:
      type: object
      required:
      - apiKey
      properties:
        apiKey:
          type: string
          description: The API key (JWT). Shown once.
    AuthApiKeyAuthRequest:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          description: Object id of one of the key's linked users.
    AuthApiKeyToken:
      type: object
      required:
      - message
      - token
      - expires
      properties:
        message:
          type: string
          example: Access granted.
        token:
          type: string
          description: JWT access token.
        expires:
          type: string
          format: date-time
        scopes:
          type: array
          items:
            type: string
          description: Scopes the token is restricted to. Empty means unrestricted.
    AuthApiKeyError:
      type: object
      properties:
        message:
          description: Database validation error object, or a string.
    AuthPing:
      type: object
      properties:
        message:
          type: string
          example: pong
        time:
          type: integer
          format: int64
          description: Server time in milliseconds since the epoch.
    ComputersComputer:
      type: object
      description: 'A computer in the inventory. The list returns only the default fields (or those named
        in `select`); the single-computer endpoint returns all non-secret fields. `id` is added to every
        document; the internal `_id` is removed from single-computer responses but may appear in list
        responses.

        '
      properties:
        id:
          type: string
          example: 00000000000000000000000a
        _id:
          type: string
          description: Present in list responses only.
        cn:
          type: string
          example: WEB01
        dNSHostName:
          type: string
          example: web01.example.com
        distinguishedName:
          type: string
        objectGUID:
          type: string
        objectSid:
          type: string
          example: S-1-5-21-1111111111-2222222222-3333333333-1001
        domain_fqdn:
          type: string
          nullable: true
        domain_netbios:
          type: string
        nonDomain:
          type: boolean
        os_type:
          type: string
          enum:
          - windows
          - linux
          - macos
        os_type_detailed:
          type: string
          enum:
          - windows_workstation
          - windows_server
          - linux
          - macos
        operatingSystem:
          type: string
        operatingSystemVersion:
          type: string
        operatingSystemServicePack:
          type: string
        serial_number:
          type: string
        last_ip:
          type: string
          example: 192.0.2.10
        last_scanned:
          type: string
          format: date-time
        lastLogonTimestamp:
          type: string
          format: date-time
        inserted_ts:
          type: string
          format: date-time
        updated_ts:
          type: string
          format: date-time
        fingerprint:
          type: string
        isS1DirBridged:
          type: boolean
          description: Virtual field. `true` for Linux or macOS computers whose bridging strategy is `secureone`
            (or unset).
        policy:
          $ref: '#/components/schemas/ComputersPolicy'
        config:
          $ref: '#/components/schemas/ComputersConfig'
        admins:
          type: object
          properties:
            current:
              type: array
              items:
                $ref: '#/components/schemas/ComputersAdmin'
            local_user_mappings:
              type: array
              items:
                type: object
                properties:
                  domain_user_objid:
                    type: string
                  domain_username:
                    type: string
                  local_account_name:
                    type: string
            managed_sids:
              type: array
              description: Accounts whose password Netwrix Privilege Secure for Discovery manages. Password
                values are never returned; `password_history` lists entry ids and timestamps only.
              items:
                type: object
                properties:
                  type:
                    type: string
                    enum:
                    - local
                  sid:
                    type: string
                  user_name:
                    type: string
                  managed:
                    type: boolean
                  last_rotated:
                    type: string
                    format: date-time
                  first_accessed:
                    type: string
                    format: date-time
                  force_expiry:
                    type: boolean
                  force_reset:
                    type: boolean
                  archived:
                    type: boolean
                  is_break_glass_account:
                    type: boolean
                  current_password_id:
                    type: string
                    description: Id of the active `password_history` entry.
                    nullable: true
                  password_history:
                    type: array
                    description: Metadata only. The encrypted password values are never returned.
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        timestamp:
                          type: string
                          format: date-time
        lastScan:
          type: object
          properties:
            msg:
              type: string
            duration:
              type: number
            scanTs:
              type: string
              format: date-time
            success:
              type: boolean
            error:
              type: string
            ip:
              type: string
            timeout:
              type: boolean
            recovered_after_timeout:
              type: boolean
        service_acct:
          type: object
          description: Only the user name and password-change time; the password is never returned.
          properties:
            username:
              type: string
            pwdChangedAt:
              type: string
              format: date-time
        auth:
          type: object
          description: Linux service account. Only `type` and `user` are returned; password and key are
            hidden.
          properties:
            type:
              type: string
              enum:
              - pass
              - key
            user:
              type: string
        life_cycle_details:
          type: object
          properties:
            archived_by:
              type: string
            archived_timestamp:
              type: string
              format: date-time
            restored_by:
              type: string
            restored_timestamp:
              type: string
              format: date-time
        rmd:
          type: object
          properties:
            isDomainController:
              type: boolean
            userAccountControlFlags:
              description: Directory userAccountControl value or flag set.
        __v:
          type: integer
          description: Internal document revision. Returned by the single-computer and update responses;
            not part of the list defaults.
      additionalProperties: true
    ComputersPolicy:
      type: object
      properties:
        scan:
          type: boolean
          description: Scan the computer automatically in the background.
        secure:
          type: boolean
          description: Protect mode.
        strict_secure:
          type: boolean
          description: Strict protect mode. Requires `secure`.
        manage_local_sids:
          type: boolean
          description: Read-only through this API. A PATCH ignores it.
    ComputersConfig:
      type: object
      properties:
        policies:
          type: object
          properties:
            edr_integration:
              type: string
              description: Id of the EDR configuration, if any. Set it with the top-level `edr_integration`
                field of PATCH.
              nullable: true
            offline_access_management:
              type: object
              properties:
                enabled:
                  type: boolean
                last_run:
                  type: string
                  format: date-time
                strategy:
                  type: string
                  description: Offline access management strategy.
                use_alternate_admin:
                  type: boolean
                break_glass_account_name_template:
                  type: string
                break_glass_account_name:
                  type: string
                manage_built_in_admin_password:
                  type: boolean
                disable_built_in_admin:
                  type: boolean
                jita_or_persistent_users_can_access_passwords:
                  type: boolean
        accounts:
          type: array
          items:
            type: object
            properties:
              sid:
                type: string
              user_name:
                type: string
              policies:
                type: object
                additionalProperties: true
        directory_bridging:
          type: object
          properties:
            strategy:
              $ref: '#/components/schemas/ComputersDirectoryBridging'
        life_cycle:
          type: object
          properties:
            restore_disabled:
              type: boolean
    ComputersDirectoryBridging:
      type: string
      description: How Linux and macOS accounts are bridged to the directory. `secureone` is the built-in
        bridge of Netwrix Privilege Secure for Discovery.
      enum:
      - secureone
      - centrify
      - powerbroker
      - sssd
      - directory_utility
      - none
    ComputersAdmin:
      type: object
      description: An account in a computer's admin inventory.
      properties:
        sid:
          type: string
          example: S-1-5-21-1111111111-2222222222-3333333333-1001
        user:
          type: string
          description: Account name (computer accounts end in `$`).
        domain:
          type: string
          description: NetBIOS domain, or the computer name for local accounts.
        domainandname:
          type: string
          example: EXAMPLE\jsmith
        sidusage:
          type: integer
          description: SID type. 1 is a user (also used for computers) and 2 is a group.
        persistent:
          type: boolean
        active:
          type: boolean
          description: True while the account has an active JITA session.
        expiring:
          type: string
          description: Session expiry as an ISO 8601 timestamp, or `-` when there is no active session.
        userId:
          type: string
          description: Object id of the user holding an active session, or `-`.
        inserted_ts:
          type: string
          format: date-time
        onHost:
          type: boolean
          description: True if the account is in the computer's local administrators group.
        svc_acct:
          type: boolean
          description: True for the service account.
        default_admin:
          type: boolean
          description: True for the built-in administrator account.
        enabled:
          type: boolean
        no_user_account:
          type: boolean
        isEntraId:
          type: boolean
        isHybrid:
          type: boolean
          description: Absent on the session entry the API adds for an active user who is not in the inventory.
        displayName:
          type: string
          nullable: true
          description: Null on the entry added for an active session of a user who is not in the inventory.
        source:
          type: string
          nullable: true
          enum:
          - directory
          - passwd
          - group
          - null
        accessViaGroup:
          type: object
          nullable: true
          description: Group through which an active session was granted, when not a direct inventory
            entry. This is the full directory group record, not a three-field subset.
          properties:
            id:
              type: string
            distinguishedName:
              type: string
            displayName:
              type: string
            cn:
              type: string
            sAMAccountName:
              type: string
            objectSid:
              type: string
            domain_fqdn:
              type: string
            domain_netbios:
              type: string
            access:
              type: object
              properties:
                date_added:
                  type: string
                  format: date-time
        session_initiated:
          type: string
          format: date-time
          description: Present only while a session is active.
    ComputersUpdateRequest:
      type: object
      description: All fields optional. If `ip` is present nothing else is applied.
      properties:
        ip:
          type: string
          format: ipv4
          description: Last known IPv4 address. A plain `user` who administers the computer may send this
            field alone. Empty and `null` values are ignored.
        policy:
          type: object
          properties:
            scan:
              type: boolean
              description: Omit to keep the current value.
            secure:
              type: boolean
              description: Protect mode. Omit to keep the current value.
            strict_secure:
              type: boolean
              description: Requires `secure` to be on. Omit to keep the current value.
            manage_local_sids:
              type: boolean
              description: Ignored.
        directory_bridging:
          $ref: '#/components/schemas/ComputersDirectoryBridging'
        system_domain:
          type: string
          description: Domain (FQDN) of a configured directory. Required with `centrify`, `powerbroker`,
            `sssd` and `directory_utility`.
          example: example.com
        edr_integration:
          type: string
          nullable: true
          description: Id of an EDR configuration (24-character object id). Top-level field of the request;
            stored at `config.policies.edr_integration`. An empty string or any other non-id value returns
            400. The id is not checked against existing EDR configurations.
    ComputersLookupIdsRequest:
      type: object
      required:
      - systemInfo
      properties:
        systemInfo:
          type: array
          items:
            type: object
            required:
            - cn
            - domain_fqdn
            properties:
              cn:
                type: string
                description: Computer name.
                maxLength: 255
              domain_fqdn:
                type: string
    ComputersLookupIdsResponse:
      type: object
      properties:
        found:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              cn:
                type: string
              domain_fqdn:
                type: string
              organizationalUnit:
                type: string
                description: The computer's distinguished name (the field name is historical).
              operatingSystem:
                type: string
        notFound:
          type: array
          description: The query pairs that did not match.
          items:
            type: object
            properties:
              cn:
                type: string
              domain_fqdn:
                type: string
    ComputersFlattenedAccount:
      type: object
      properties:
        _id:
          type: string
        cn:
          type: string
        displayName:
          type: string
        distinguishedName:
          type: string
        domain_fqdn:
          type: string
        domain_netbios:
          type: string
        member:
          type: array
          description: Distinguished names of the groups this account belongs to.
          items:
            type: string
        obj_type:
          type: string
          enum:
          - user
          - group
          - computer
        objectSid:
          type: string
          example: S-1-5-21-1111111111-2222222222-3333333333-1001
        sAMAccountName:
          type: string
        sn:
          type: string
        isDirect:
          type: boolean
          description: Present and `true` for accounts listed directly as administrators.
    ComputersHistoryEntry:
      type: object
      properties:
        processed:
          type: string
          format: date-time
          nullable: true
        system:
          type: object
          properties:
            cn:
              type: string
        request:
          type: object
          properties:
            activity:
              type: array
              items:
                type: object
                properties:
                  timestamp:
                    type: string
                    format: date-time
                  code:
                    type: integer
                  message:
                    type: string
                  comment:
                    type: string
                    description: Managed account events only.
            user:
              type: object
              description: The requesting user, populated from the directory record. It is `null` when
                the job was queued by the built-in superadmin account (no directory record).
              additionalProperties: true
              nullable: true
              properties:
                id:
                  type: string
                cn:
                  type: string
                displayName:
                  type: string
                sn:
                  type: string
                sAMAccountName:
                  type: string
                distinguishedName:
                  type: string
                objectSid:
                  type: string
                domain_fqdn:
                  type: string
                domain_netbios:
                  type: string
            status:
              type: string
              enum:
              - pending
              - expiring
              - error
              - dismissed
              - completed
            type:
              type: string
            expires:
              type: string
              format: date-time
            investigation:
              type: object
              properties:
                deviceName:
                  type: string
                start:
                  type: string
                  format: date-time
                end:
                  type: string
                  format: date-time
        comment:
          type: string
    ComputersRestoreResponse:
      type: object
      properties:
        message:
          type: string
        restoredId:
          type: string
    ComputersRegisterRequest:
      type: object
      required:
      - system
      properties:
        system:
          type: string
          description: Fully qualified host name (`<cn>.<domain>`).
          example: web01.example.com
        os_type:
          type: string
          enum:
          - windows
          - linux
          - macos
          description: Defaults to `linux` if `nondomain` is true, otherwise `windows`.
        username:
          type: string
          description: Registration account used for the registration scan.
        password:
          type: string
          format: password
        scan:
          type: boolean
          description: Enable automatic scanning. Enables only; never disables.
        secure:
          type: boolean
          description: Enable protect mode after registration. Not supported for macOS.
        persistent:
          type: string
          description: 'Comma-separated administrators to mark persistent. Windows uses `DOMAIN\name`
            (`.\name` means the computer''s own domain); Linux and macOS use plain account names.

            '
          example: EXAMPLE\jsmith, .\localadmin
        scanNow:
          type: boolean
          description: Run a registration scan immediately. For macOS this is what triggers a scan.
        nondomain:
          type: boolean
          description: Linux only. Register a computer that is not joined to a directory.
        directory_bridging:
          $ref: '#/components/schemas/ComputersDirectoryBridging'
        admins:
          type: array
          description: Linux only, new computers only. Ids of local administrator records to add, which
            also receive sudoers entries.
          items:
            type: string
        osVersion:
          type: string
          description: macOS only.
        serialNumber:
          type: string
          description: macOS only.
    ComputersUnregisterRequest:
      type: object
      required:
      - system
      properties:
        system:
          type: string
          example: web01.example.com
        username:
          type: string
        password:
          type: string
          format: password
    ComputersQueueActivity:
      type: object
      description: Final activity entry of the queue job. `code` 0 means success.
      properties:
        timestamp:
          type: string
          format: date-time
        code:
          type: integer
        message:
          type: string
      additionalProperties: true
    CompAccessRequestBody:
      type: object
      properties:
        t:
          type: integer
          minimum: 1
          description: Session length in minutes (default and maximum 240 unless configured).
        comment:
          type: string
        userId:
          type: string
          description: Object id of the user to request access for (admin role only).
    CompSessionResult:
      type: object
      required:
      - id
      - message
      properties:
        id:
          type: string
          description: Queue item id of the access request or session. Stays the same across extend and
            expire calls on that session.
        message:
          type: string
    CompAdminAddRequest:
      type: object
      required:
      - id
      properties:
        id:
          type: string
          description: Object id of a user, group, or computer. Must have a SID.
        persistent:
          type: boolean
          default: false
          description: Defaults to false. Any value other than a boolean or the strings `true`/`false`
            is stored as false.
        sudo_permissions:
          type: string
          description: Linux only. The privilege part of a sudoers line (for example `ALL=(ALL) NOPASSWD:ALL`),
            not a full line.
    CompAdminUpdateRequest:
      type: object
      required:
      - persistent
      properties:
        sid:
          type: string
        id:
          type: string
          description: Object id of a user, group, or computer. Used only if `sid` is absent.
        persistent:
          type: boolean
      anyOf:
      - required:
        - sid
      - required:
        - id
    CompAdminRemoveRequest:
      type: object
      properties:
        sid:
          type: string
        id:
          type: string
          description: Object id of a user, group, or computer. Used only if `sid` is absent.
      anyOf:
      - required:
        - sid
      - required:
        - id
    CompOamRequest:
      type: object
      required:
      - enabled
      properties:
        enabled:
          type: boolean
        strategy:
          type: string
          enum:
          - os-best-practice
          - managed-built-in
          - custom
          description: Defaults to `os-best-practice` when other parameters are supplied or the computer
            has no strategy yet. Ignored when the computer already has a strategy and only `enabled` is
            sent.
        use_alternate_admin:
          type: boolean
        manage_built_in_admin_password:
          type: boolean
        disable_built_in_admin:
          type: boolean
        jita_or_persistent_users_can_access_passwords:
          type: boolean
          description: Not allowed with `os-best-practice` unless false.
        break_glass_account_name_template:
          type: string
          description: Name template for the alternate administrator account. Each `?` is replaced with
            a random letter or digit; `*` is a literal character. Defaults to `S1_ALT_ADMIN`.
          default: S1_ALT_ADMIN
    CompSudoersDocument:
      type: object
      properties:
        sudoersHash:
          type: string
        appliedAt:
          type: string
          nullable: true
          description: HTTP-date string, present only on scanned documents (omitted from a staged document).
        createdAt:
          type: string
          description: HTTP-date string (`Tue, 27 Oct 2026 22:03:28 GMT`). For scan documents this is
            the time they were applied.
        createdById:
          type: string
          nullable: true
        createdByName:
          type: string
          description: DOMAIN\user of the creator. Absent when no creator is recorded (for example a scan).
        sudoersBlob:
          type: string
          description: Full sudoers text, lines joined with newlines.
    CompSudoersState:
      type: object
      required:
      - lastScanSudoers
      - stagedSudoers
      properties:
        lastScanSudoers:
          allOf:
          - $ref: '#/components/schemas/CompSudoersDocument'
          nullable: true
          type: object
        stagedSudoers:
          allOf:
          - $ref: '#/components/schemas/CompSudoersDocument'
          nullable: true
          type: object
    CompSudoersCreateRequest:
      type: object
      required:
      - sudoers_blob
      properties:
        sudoers_blob:
          type: string
          minLength: 1
          description: Complete sudoers file text, newline separated.
    CompSudoersCreateResponse:
      type: object
      properties:
        sudoersHash:
          type: string
        createdAt:
          type: string
          description: HTTP-date string, for example `Tue, 27 Oct 2026 22:03:28 GMT`.
        createdById:
          type: string
        createdByName:
          type: string
          description: DOMAIN\user of the caller.
    CompSudoersPrivilege:
      type: object
      properties:
        entry:
          type: string
          description: Sudoers line.
        entry_type:
          type: string
          description: Classification such as User, Group, UserList, UserAlias, or UserAliasDefinition.
        direct_entry:
          type: boolean
          description: True when the entry names the account alone, not through a list, alias, or group.
    EdrInvestigationRequest:
      type: object
      description: Optional link-out settings. `path` is ignored on input and fixed by the server.
      properties:
        enabled:
          type: boolean
          default: false
        base_url:
          type: string
          nullable: true
          maxLength: 255
    EdrInvestigationResponse:
      type: object
      properties:
        enabled:
          type: boolean
        base_url:
          type: string
          nullable: true
        path:
          type: string
          description: 'Server-set default: investigate/events/en-US/app/eam2/investigate__computer (CrowdStrike),
            dv/hunting (SentinelOne), cb/investigate/events/events (Carbon Black).'
    EdrCrowdstrikeConfigRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - crowdstrike_falcon
        name:
          type: string
          maxLength: 255
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                base_url:
                  type: string
                  format: uri
                  description: Trailing slash is removed.
                use_proxy:
                  type: boolean
                  default: false
                credentials:
                  type: object
                  properties:
                    api:
                      type: object
                      properties:
                        client_id:
                          type: string
                        client_secret:
                          type: string
                          format: password
                          writeOnly: true
            investigation:
              $ref: '#/components/schemas/EdrInvestigationRequest'
    EdrSentinelOneConfigRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - sentinelone
        name:
          type: string
          maxLength: 255
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                base_url:
                  type: string
                  format: uri
                use_proxy:
                  type: boolean
                  default: false
                account_id:
                  type: string
                  description: Required when enabled.
                site_id:
                  type: string
                  description: Required for site-scoped tokens; must be absent for account-scoped tokens.
                    Sending account_id without site_id clears a stored site_id.
                credentials:
                  type: object
                  properties:
                    api_token:
                      type: string
                      format: password
                      writeOnly: true
                      maxLength: 1024
                rate_limit_enabled:
                  type: boolean
                  default: true
                rate_limit_requests_per_second:
                  type: number
                  default: 10
                rate_limit_burst_capacity:
                  type: number
                  default: 20
                rate_limit_max_wait_seconds:
                  type: number
                  default: 30
                domain_fallback_list:
                  type: array
                  items:
                    type: string
                  default:
                  - WORKGROUP
                  - ''
            investigation:
              $ref: '#/components/schemas/EdrInvestigationRequest'
    EdrCarbonBlackConfigRequest:
      type: object
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - carbon_black_cloud
        name:
          type: string
          maxLength: 255
        config:
          type: object
          properties:
            integration:
              type: object
              description: When enabled, org_key and both credential pairs are required, and base_url
                must not contain "appservices" or "integrationServices".
              properties:
                enabled:
                  type: boolean
                  default: false
                base_url:
                  type: string
                  format: uri
                org_key:
                  type: string
                use_proxy:
                  type: boolean
                  default: false
                credentials:
                  type: object
                  properties:
                    live_response_api:
                      $ref: '#/components/schemas/EdrCarbonBlackKeyPairRequest'
                    custom_api:
                      $ref: '#/components/schemas/EdrCarbonBlackKeyPairRequest'
                rate_limit_enabled:
                  type: boolean
                  default: true
                rate_limit_requests_per_second:
                  type: number
                  default: 5
                rate_limit_burst_capacity:
                  type: number
                  default: 10
                rate_limit_max_wait_seconds:
                  type: number
                  default: 30
            investigation:
              $ref: '#/components/schemas/EdrInvestigationRequest'
    EdrCarbonBlackKeyPairRequest:
      type: object
      properties:
        api_id:
          type: string
        api_secret_key:
          type: string
          format: password
          writeOnly: true
    EdrTaniumConfigRequest:
      type: object
      description: Tanium Cloud variant. The list operation omits tanium_cloud configurations while the
        `tanium_cloud` release toggle is off; the other operations do not check the toggle.
      required:
      - provider
      properties:
        provider:
          type: string
          enum:
          - tanium_cloud
        name:
          type: string
          maxLength: 255
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: Admin-supplied API key expiry. Accepted on create and update.
        config:
          type: object
          description: Investigation settings are ignored for Tanium.
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                base_url:
                  type: string
                  format: uri
                use_proxy:
                  type: boolean
                  default: false
                credentials:
                  type: object
                  properties:
                    api_key:
                      type: string
                      format: password
                      writeOnly: true
                options:
                  $ref: '#/components/schemas/EdrTaniumOptions'
    EdrTaniumOptions:
      type: object
      description: Only these options are accepted from the request; the other stored options are internal.
      properties:
        bulk_scan_enabled:
          type: boolean
          default: false
        bulk_group_name:
          type: string
          description: Required when bulk_scan_enabled is true.
        bulk_timeout_seconds:
          type: integer
          minimum: 1
          default: 600
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
        bulk_action_check_interval_seconds:
          type: integer
          minimum: 1
          default: 30
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
        skip_direct_connection:
          type: boolean
          default: false
        hostname_fallback:
          type: boolean
          default: false
        circuit_breaker_enabled:
          type: boolean
          default: true
        circuit_breaker_failure_threshold:
          type: integer
          minimum: 1
          default: 5
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
        circuit_breaker_open_timeout_seconds:
          type: integer
          minimum: 1
          default: 60
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
        bulk_single_device_retry_enabled:
          type: boolean
          default: false
        bulk_single_device_retry_max_devices:
          type: integer
          minimum: 1
          default: 100
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
        bulk_single_device_retry_statuses:
          type: array
          items:
            type: string
          description: 'Documented values: EXECUTION_FAILED, TIMEOUT, PARSE_ERROR, OFFLINE.'
          default:
          - EXECUTION_FAILED
          - TIMEOUT
          - PARSE_ERROR
        bulk_scan_schedule_enabled:
          type: boolean
          default: false
        bulk_scan_prevent_overlap:
          type: boolean
          default: true
        bulk_scan_interval_hours:
          type: integer
          minimum: 1
          default: 4
          description: 0 is accepted by the stored model but ignored by the API (the stored value is kept);
            a request whose only option values are 0 returns 422.
    EdrConfigurationRequest:
      description: Provider configuration; `provider` selects the variant. On update the server ignores
        `provider` and uses the stored provider; a missing or mismatched value is accepted and does not
        change the provider. The variant schemas list `provider` as required only so the discriminator
        resolves, so clients should send the stored provider.
      oneOf:
      - $ref: '#/components/schemas/EdrCrowdstrikeConfigRequest'
      - $ref: '#/components/schemas/EdrSentinelOneConfigRequest'
      - $ref: '#/components/schemas/EdrCarbonBlackConfigRequest'
      - $ref: '#/components/schemas/EdrTaniumConfigRequest'
      discriminator:
        propertyName: provider
        mapping:
          crowdstrike_falcon: '#/components/schemas/EdrCrowdstrikeConfigRequest'
          sentinelone: '#/components/schemas/EdrSentinelOneConfigRequest'
          carbon_black_cloud: '#/components/schemas/EdrCarbonBlackConfigRequest'
          tanium_cloud: '#/components/schemas/EdrTaniumConfigRequest'
    EdrCrowdstrikeConfigResponse:
      type: object
      properties:
        _id:
          $ref: '#/components/schemas/PlatformObjectId'
        provider:
          type: string
          enum:
          - crowdstrike_falcon
        name:
          type: string
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                base_url:
                  type: string
                use_proxy:
                  type: boolean
                credentials:
                  type: object
                  properties:
                    api:
                      type: object
                      properties:
                        client_id:
                          type: string
            investigation:
              $ref: '#/components/schemas/EdrInvestigationResponse'
      required:
      - provider
    EdrSentinelOneConfigResponse:
      type: object
      description: site_id is accepted on input but is not returned.
      properties:
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: API token expiry, read from the vendor after a save. Null when unknown.
        _id:
          $ref: '#/components/schemas/PlatformObjectId'
        provider:
          type: string
          enum:
          - sentinelone
        name:
          type: string
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                base_url:
                  type: string
                use_proxy:
                  type: boolean
                account_id:
                  type: string
                rate_limit_enabled:
                  type: boolean
                rate_limit_requests_per_second:
                  type: number
                rate_limit_burst_capacity:
                  type: number
                rate_limit_max_wait_seconds:
                  type: number
                domain_fallback_list:
                  type: array
                  items:
                    type: string
            investigation:
              $ref: '#/components/schemas/EdrInvestigationResponse'
      required:
      - provider
    EdrCarbonBlackConfigResponse:
      type: object
      description: api_secret_key values are never returned.
      properties:
        _id:
          $ref: '#/components/schemas/PlatformObjectId'
        provider:
          type: string
          enum:
          - carbon_black_cloud
        name:
          type: string
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                base_url:
                  type: string
                org_key:
                  type: string
                use_proxy:
                  type: boolean
                credentials:
                  type: object
                  properties:
                    live_response_api:
                      type: object
                      properties:
                        api_id:
                          type: string
                    custom_api:
                      type: object
                      properties:
                        api_id:
                          type: string
                rate_limit_enabled:
                  type: boolean
                rate_limit_requests_per_second:
                  type: number
                rate_limit_burst_capacity:
                  type: number
                rate_limit_max_wait_seconds:
                  type: number
            investigation:
              $ref: '#/components/schemas/EdrInvestigationResponse'
      required:
      - provider
    EdrTaniumConfigResponse:
      type: object
      description: The list operation omits tanium_cloud configurations while the `tanium_cloud` release
        toggle is off; the other operations do not check the toggle. Secrets and the investigation base_url
        and path are never returned.
      properties:
        _id:
          $ref: '#/components/schemas/PlatformObjectId'
        provider:
          type: string
          enum:
          - tanium_cloud
        tokenExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: API key expiry as supplied by the admin. Null when not set.
        name:
          type: string
        config:
          type: object
          properties:
            integration:
              type: object
              properties:
                enabled:
                  type: boolean
                base_url:
                  type: string
                use_proxy:
                  type: boolean
                options:
                  $ref: '#/components/schemas/EdrTaniumOptions'
            investigation:
              type: object
              properties:
                enabled:
                  type: boolean
      required:
      - provider
    EdrConfigurationResponse:
      oneOf:
      - $ref: '#/components/schemas/EdrCrowdstrikeConfigResponse'
      - $ref: '#/components/schemas/EdrSentinelOneConfigResponse'
      - $ref: '#/components/schemas/EdrCarbonBlackConfigResponse'
      - $ref: '#/components/schemas/EdrTaniumConfigResponse'
      discriminator:
        propertyName: provider
        mapping:
          crowdstrike_falcon: '#/components/schemas/EdrCrowdstrikeConfigResponse'
          sentinelone: '#/components/schemas/EdrSentinelOneConfigResponse'
          carbon_black_cloud: '#/components/schemas/EdrCarbonBlackConfigResponse'
          tanium_cloud: '#/components/schemas/EdrTaniumConfigResponse'
    EdrValidationResult:
      type: object
      description: Result for CrowdStrike Falcon, SentinelOne and Tanium Cloud.
      required:
      - success
      - messages
      properties:
        success:
          type: boolean
        messages:
          type: array
          items:
            type: string
    EdrValidationResultCarbonBlack:
      type: object
      description: Result for Carbon Black Cloud. Only the Devices API result is critical.
      required:
      - messages
      - devicesApiSuccess
      - restApiSuccess
      - liveResponseApiSuccess
      properties:
        messages:
          type: array
          items:
            type: string
        devicesApiSuccess:
          type: boolean
        restApiSuccess:
          type: boolean
        liveResponseApiSuccess:
          type: boolean
    EdrBulkScan:
      type: object
      properties:
        bulk_scan_id:
          type: string
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        duration_seconds:
          type: number
        status:
          type: string
          enum:
          - COMPLETED
          - PARTIAL
          - FAILED
          description: PARTIAL when any device failed storage; FAILED when devices were attempted and
            none were stored; otherwise COMPLETED.
        device_summary:
          type: object
          description: Per-status device counts.
          additionalProperties: true
        storage_summary:
          type: object
          description: Database-side outcome for devices that returned SUCCESS.
          additionalProperties: true
        metrics:
          type: object
          description: Performance metrics. Empty object when none were recorded.
          additionalProperties: true
        failed_devices:
          type: array
          description: Devices whose status was not SUCCESS.
          items:
            type: object
            additionalProperties: true
      description: A bulk scan summary. action_id and target_group_id are stored by the scan service but
        are not returned by this API.
    CfgProxyConfig:
      type: object
      description: Outbound proxy settings. Empty object when not configured. Password is never returned.
      properties:
        id:
          type: string
          example: 00000000000000000000000a
        protocol:
          type: string
          enum:
          - http
          - https
        host:
          type: string
          description: Proxy host name or address, without a scheme.
          example: proxy.example.com
        port:
          type: string
          example: '8080'
        verify_ssl:
          type: boolean
          description: Verify the proxy TLS certificate. Returned only when `protocol` is `https`.
        auth:
          type: object
          properties:
            username:
              type: string
              example: proxy-user
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CfgProxyUpdate:
      type: object
      description: At least one property is required. After merging with the stored configuration the
        result needs a valid protocol, host and port.
      properties:
        protocol:
          type: string
          enum:
          - http
          - https
        host:
          type: string
          example: proxy.example.com
        port:
          type: string
          example: '8080'
          description: Any non-empty string; a JSON number is accepted and cast to a string. No numeric
            or range check.
        verify_ssl:
          type: boolean
          default: true
        auth:
          type: object
          description: Both fields must be non-empty if present. Send an empty object to remove credentials.
          properties:
            username:
              type: string
            password:
              type: string
              format: password
              writeOnly: true
    CfgProxyValidateResult:
      type: object
      required:
      - success
      properties:
        success:
          type: boolean
        messages:
          type: array
          description: Present when `success` is false.
          items:
            type: string
            example: 'Proxy Configuration error: Invalid status code. Expected a 2xx status code but got
              300.'
    CfgManagedSidsConfig:
      type: object
      properties:
        _id:
          type: string
          example: 00000000000000000000000a
        enabled:
          type: boolean
          default: false
          description: Whether Local Account Password Management is enabled globally.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        type:
          type: string
          enum:
          - managed_sids
          description: Present only on the never-saved default and on the response of the PATCH that first
            creates the document.
        __v:
          type: integer
          description: Present on saved documents.
      description: 'Never-saved default: `{type: "managed_sids", enabled: false, _id}` (no timestamps,
        no `__v`). After the first save: `{_id, enabled, createdAt, updatedAt, __v}` (no `type`).'
    CfgManagedSidsUpdate:
      type: object
      properties:
        enabled:
          type: boolean
    CfgDomainAccount:
      type: object
      description: A service account used by the scan or write operations. The password is write-only.
      properties:
        domain:
          type: string
          description: NetBIOS domain name.
          example: EXAMPLE
        domain_fqdn:
          type: string
          example: example.com
        user:
          type: string
          example: svc-netwrix
        pass:
          type: string
          format: password
          writeOnly: true
    CfgWriteAccount:
      allOf:
      - $ref: '#/components/schemas/CfgDomainAccount'
      - type: object
        properties:
          auth_strategy:
            type: string
            enum:
            - default
            - group_account
            default: default
            description: Service-account group strategy. Availability depends on the deployment.
          auth_strategy_accounts:
            type: array
            description: Required and non-empty when `auth_strategy` is `group_account` and the toggle
              is on. Replaced, not merged, on update.
            items:
              type: object
              required:
              - domain
              - user
              properties:
                domain:
                  type: string
                user:
                  type: string
    CfgScanConfig:
      type: object
      properties:
        read_acct:
          $ref: '#/components/schemas/CfgDomainAccount'
        write_acct:
          $ref: '#/components/schemas/CfgWriteAccount'
        default_policy:
          type: object
          properties:
            scan:
              type: boolean
              default: false
            secure:
              type: boolean
              default: false
            strict_secure:
              type: boolean
              default: false
            windows_auth_type:
              type: string
              default: ntlm
              description: Free-form string; the server stores any value as sent (`NTLM`, `kerberos` and
                `bogus` were all accepted unchanged). The default for a new domain is the lowercase `ntlm`.
    CfgManagedSidsPolicy:
      type: object
      description: Local administrator (RID 500) password management defaults for the domain.
      properties:
        default_policy:
          type: object
          properties:
            enabled:
              type: boolean
              default: false
        interval_days:
          type: number
        password_complexity:
          type: object
          properties:
            min_length:
              type: number
              minimum: 1
            min_digits:
              type: number
              minimum: 0
            min_uppercase:
              type: number
              minimum: 0
            min_special_chars:
              type: number
              minimum: 0
            exclude_chars:
              type: string
              maxLength: 255
        rotation:
          type: object
          properties:
            expiry_minutes_after_access:
              type: number
              minimum: 0
            days:
              type: number
              minimum: 0
        retention:
          type: object
          properties:
            days:
              type: number
              minimum: 1
    CfgFailoverConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        failover_dc_source:
          type: string
          enum:
          - dns_priority
          default: dns_priority
        use_configured_port:
          type: boolean
          default: true
        dc_fail_criteria:
          type: object
          properties:
            strategy:
              type: string
              enum:
              - retry_attempts
              - total_duration
              default: retry_attempts
            total_duration_seconds:
              type: number
            retry_attempts_max:
              type: number
              default: 5
            wait_between_attempts_seconds:
              type: number
              default: 1
    CfgSyncState:
      type: object
      description: Read-only synchronization state maintained by the server.
      readOnly: true
      properties:
        previous_usn:
          type: number
        highest_usn:
          type: number
        start:
          type: string
          format: date-time
        finish:
          type: string
          format: date-time
        result:
          type: number
        in_progress:
          type: boolean
    CfgDefaultSystemConfig:
      type: object
      properties:
        policies:
          type: object
          properties:
            edr_integration:
              type: string
              nullable: true
              description: Id of an EDR integration configuration.
            offline_access_management:
              type: object
              properties:
                enabled:
                  type: boolean
                  default: false
                strategy:
                  type: string
                  enum:
                  - os-best-practice
                  - managed-built-in
                  - custom
                  default: os-best-practice
                  description: Offline access strategy. Sending the `offline_access_management` object
                    requires a boolean `enabled`; a bad strategy returns 422.
                use_alternate_admin:
                  type: boolean
                break_glass_account_name_template:
                  type: string
                manage_built_in_admin_password:
                  type: boolean
                disable_built_in_admin:
                  type: boolean
                jita_or_persistent_users_can_access_passwords:
                  type: boolean
    CfgLdapWrite:
      description: Domain configuration for create. The listed fields are required.
      allOf:
      - $ref: '#/components/schemas/CfgLdapUpdate'
      - type: object
        required:
        - name
        - server
        - port
        - bind_dn
        - bind_pass
        - search_base
        - scan_config
    CfgLdapUpdate:
      type: object
      description: Domain configuration fields for a partial update; every field is optional.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          example: Example domain
        server:
          type: string
          minLength: 1
          maxLength: 255
          description: Domain controller host name.
          example: dc01.example.com
        port:
          type: integer
          minimum: 1
          maximum: 65535
          example: 636
        bind_method:
          type: string
          enum:
          - simple
          - kerberos
        bind_dn:
          type: string
          minLength: 1
          maxLength: 255
        bind_pass:
          type: string
          format: password
          writeOnly: true
          minLength: 1
          maxLength: 255
        search_base:
          type: string
          minLength: 1
          maxLength: 255
          example: dc=example,dc=com
        page_size:
          type: integer
          default: 1000
        scope:
          type: string
          default: subtree
        ssl:
          type: boolean
          default: true
        verify_ssl:
          type: boolean
          default: false
        ca_cert:
          type: string
          nullable: true
          maxLength: 65535
          description: PEM CA certificate. Sending a new value generates a new `ca_cert_id`.
        sync_enabled:
          type: boolean
          default: true
          description: Whether the domain takes part in directory sync. Whether the setting takes effect
            depends on the deployment.
        failover_config:
          $ref: '#/components/schemas/CfgFailoverConfig'
        scan_config:
          $ref: '#/components/schemas/CfgScanConfig'
        managed_sids:
          $ref: '#/components/schemas/CfgManagedSidsPolicy'
        default_system_config:
          $ref: '#/components/schemas/CfgDefaultSystemConfig'
        default_system_config_linux:
          type: object
          properties:
            directory_bridging:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                  - secureone
                  - centrify
                  - powerbroker
                  - sssd
                  - none
                  default: secureone
        extra:
          $ref: '#/components/schemas/CfgLdapExtra'
    CfgLdapExtra:
      type: object
      description: Creates or updates the macOS domain service account alongside the domain. On update,
        an empty `svcUser` deletes it; a new one needs both `svcUser` and `svcPass`.
      properties:
        macosConfig:
          $ref: '#/components/schemas/CfgMacosWrite'
    CfgLdapConfig:
      type: object
      description: A stored Active Directory domain configuration. Bind and scan account passwords are
        never returned.
      properties:
        id:
          type: string
          example: 00000000000000000000000a
        _id:
          type: string
          description: Present in list items only (same value as `id`).
          example: 00000000000000000000000a
        name:
          type: string
        server:
          type: string
        port:
          type: integer
        bind_method:
          type: string
          enum:
          - simple
          - kerberos
        bind_dn:
          type: string
        search_base:
          type: string
        page_size:
          type: integer
        scope:
          type: string
        ssl:
          type: boolean
        verify_ssl:
          type: boolean
        ca_cert:
          type: string
          nullable: true
        ca_cert_id:
          type: string
          nullable: true
        modified_timestamp:
          type: string
          format: date-time
        sync:
          $ref: '#/components/schemas/CfgSyncState'
        sync_enabled:
          type: boolean
        syncActivity:
          type: object
          readOnly: true
          properties:
            errorCode:
              type: number
            errorMessage:
              type: string
            startTs:
              type: string
              format: date-time
            activity:
              type: string
        failover_history:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              initial_dc:
                type: object
                properties:
                  server:
                    type: string
                  port:
                    type: integer
              attempted_dcs:
                type: array
                items:
                  type: object
                  properties:
                    server:
                      type: string
                    port:
                      type: integer
              failover_dc:
                type: object
                properties:
                  server:
                    type: string
                  port:
                    type: integer
              failover_success:
                type: boolean
              sync_start:
                type: string
                format: date-time
              sync_end:
                type: string
                format: date-time
        failover_config:
          $ref: '#/components/schemas/CfgFailoverConfig'
        scan_config:
          $ref: '#/components/schemas/CfgScanConfig'
        domain_fqdn:
          type: string
          description: Filled after the first synchronization.
        domain_netbios:
          type: string
        managed_sids:
          $ref: '#/components/schemas/CfgManagedSidsPolicy'
        default_system_config:
          $ref: '#/components/schemas/CfgDefaultSystemConfig'
        default_system_config_linux:
          type: object
          properties:
            directory_bridging:
              type: object
              properties:
                strategy:
                  type: string
                  enum:
                  - secureone
                  - centrify
                  - powerbroker
                  - sssd
                  - none
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CfgLdapDiscoveredServer:
      type: object
      properties:
        host:
          type: string
          example: dc01.example.com
        port:
          type: integer
          example: 389
        ssl:
          type: boolean
          description: True when the port is 636.
        search_base:
          type: string
          example: dc=example,dc=com
    CfgDiscoverError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              example: ENOTFOUND
            msg:
              type: string
              example: Unable to connect to the host.
    CfgLdapValidateRequest:
      type: object
      properties:
        host:
          type: string
          example: dc01.example.com
        port:
          type: integer
          example: 636
        ssl:
          type: boolean
          description: Use `ldaps://` when true, `ldap://` otherwise.
        bind_method:
          type: string
          enum:
          - simple
          - kerberos
        bind_dn:
          type: string
        bind_pass:
          type: string
          format: password
          writeOnly: true
        ldap_config_id:
          type: string
          description: Id of a saved domain whose stored bind password is used when `bind_pass` is not
            sent.
        search_base:
          type: string
        verify_ssl:
          type: boolean
        ca_cert:
          type: string
    CfgLdapValidateResult:
      type: object
      required:
      - valid
      properties:
        valid:
          type: boolean
        error:
          type: object
          description: Present when `valid` is false.
          properties:
            code:
              type: string
              description: One of ConfigurationInvalid, InvalidCredentialsError, MissingCredentials, ENOTFOUND,
                NoLdapConfig, NoSearchBase, TimeoutError, FailedBindingKerberos, FailedBindingSimple,
                FailedEntraIDValidate, or another error name.
              example: InvalidCredentialsError
            msg:
              type: string
              example: The credentials provided are not valid.
    CfgEntraWrite:
      description: Entra ID tenant configuration for create. The listed fields are required.
      allOf:
      - $ref: '#/components/schemas/CfgEntraUpdate'
      - type: object
        required:
        - name
        - client_id
        - tenant_id
        - client_secret
        - scan_config
    CfgEntraUpdate:
