        '404':
          $ref: '#/components/responses/NotFoundText'
    put:
      tags:
      - Configuration
      operationId: updateLdapConfig
      summary: Update an Active Directory domain configuration
      description: 'Deep-merges the body into the stored configuration (partial updates are fine). If
        `scan_config.write_acct.auth_strategy_accounts` is sent, the stored list is replaced rather than
        merged. Password fields are re-encrypted when sent. The optional `extra` object creates, updates
        or (when `svcUser` is empty) deletes the macOS domain service account.

        Accepts JSON or `application/x-www-form-urlencoded` bodies.

        **Required role:** `admin` or `superadmin`.

