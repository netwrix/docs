openapi: 3.0.3
info:
  title: Netwrix Privilege Secure for Discovery API
  version: 26.09.1
  description: 'REST API for Netwrix Privilege Secure for Discovery, release 26.09.1.


    **Base path.** All endpoints are under `/api/v1` on your server.


    **Authentication.** Call `POST /login` (or `POST /api-keys/auth` with an API key) to get a JSON Web
    Token (JWT). Send it on every other call as `Authorization: Bearer <access-token>`. The server also
    accepts the `x-access-token` header. The token lifetime is set by the administrator; read `expires`
    in the sign-in response. There is no refresh endpoint, so sign in again when the token expires.


    **Roles.** The description of each operation ends with or contains a **Required role** line: `superadmin`,
    `admin` or `user`. Administrator operations accept `superadmin` and `admin`; user operations accept
    all three.


    **Request bodies.** The server parses both `application/json` and `application/x-www-form-urlencoded`
    bodies.


    **Paging.** Operations that take `limit` and `page` are paged; other list operations return every
    record in one response. `limit` defaults to 100, and values above the maximum of 1000 are reduced
    to 1000. A `limit` below 1 or a non-numeric `limit` returns an empty page instead of an error. `page`
    starts at 1. Paged responses carry `X-Pagination-*` and `Link` headers; each operation lists the headers
    it sends. Add `inlinePageInfo` to wrap the body as `{limit, page, pages, total, links, docs}`; a few
    operations, such as `GET /config/integrations/edr/bulk-scans`, always return a wrapped body with their
    own paging (`{docs, page, pages, total, limit}`). Many lists also accept an `advanced` query for filtering,
    plus `sort` and `select`.


    **Errors.** Errors use one of four shapes: `{name, message, context, code}`, `{error}`, `{message}`,
    or a plain-text 404 for an invalid `:id`. Each operation lists the shapes it can return.

    '
  license:
    name: Netwrix Master Software and Services Agreement
    url: https://netwrix.com/en/legal/eula/
servers:
- url: https://{server-fqdn}/api/v1
  description: Your Netwrix Privilege Secure for Discovery server
  variables:
    server-fqdn:
      default: <server-fqdn>
      description: Fully qualified domain name of the server.
security:
- bearerAuth: []
tags:
- name: Authentication
  description: Sign in, two-factor authentication and token verification.
- name: API keys
  description: Authenticate with an API key to get an access token, and manage API keys.
- name: Health
  description: Unauthenticated service health checks.
- name: Computers
  description: 'Computer (system) inventory: list, read, create, update and delete managed computers.'
- name: Computers - Access
  description: Just-in-time access (JITA) requests and sessions on a computer.
- name: Computers - Admins
  description: Administrators discovered on a computer.
- name: Computers - Passwords
  description: Managed local-account passwords on a computer.
- name: Computers - Offline Access Management
  description: Offline Access Management (OAM) data for a computer.
- name: Computers - Sudoers
  description: Sudoers policy on Linux and BSD computers.
- name: Systems
  description: System records and their discovered attributes.
- name: Users
  description: Users and service accounts provisioned in the product.
- name: Groups
  description: Groups provisioned in the product and their members.
- name: Queue
  description: 'Queue items for access requests: read the pending item for a computer and dismiss failed
    items.'
- name: Configuration
  description: Proxy, domains, platforms, single sign-on and other server settings.
- name: Configuration - EDR integrations
  description: Configure endpoint detection and response (EDR) providers and review bulk scans.
paths:
  /login:
    post:
      operationId: login
      tags:
      - Authentication
      summary: Sign in and get an access token
      description: "Authenticates a user and returns a JWT access token. Send the token on later calls\
        \ as\n`Authorization: Bearer <access-token>`.\n\nThree kinds of account can sign in:\n\n* **Active\
        \ Directory user**: send `username`, `domain` (NetBIOS name) and `password`. The user must be\n\
        \  provisioned in the product (directly or through group membership).\n* **Built-in service account**:\
        \ send `username` `secureone` and `password` with no `domain`. The\n  account is `superadmin`\
        \ and is disabled until its password has been changed from the default.\n* **SAML single sign-on**:\
        \ when SSO is enabled, the identity provider posts its SAML response to this\n  endpoint. On success\
        \ the server answers with a 301 redirect to `/#/login?samlAuth=<access-token>`\n  instead of a\
        \ JSON body. This flow is meant for browsers.\n\n**Two-factor authentication.** Depends on how\
        \ the server is configured.\n\n* No second factor configured for the user: one call returns the\
        \ token.\n* RADIUS enabled: always send `code` (the one-time password). Without it the server\
        \ returns 401 with\n  `code` `2FA_Token_Required`.\n* Built-in time-based one-time password (TOTP)\
        \ enabled for the user and already enrolled: send `code`.\n  Without it the server returns 401\
        \ with `code` `2FA_Token_Required`.\n* TOTP enabled but not yet enrolled: the first call (no `code`)\
        \ returns **200** with `code`\n  `2FA_Config_Required` and a base32 `key`. Add `key` to an authenticator\
        \ app, then call again sending\n  the same `key` and the current six-digit `code`. The server\
        \ stores the key and returns the token.\n\nThe token lifetime is configurable by the administrator\
        \ (default 10 hours). Read `expires` in the\nresponse instead of assuming a fixed lifetime. There\
        \ is no refresh endpoint; sign in again.\n\nBoth `application/json` and `application/x-www-form-urlencoded`\
        \ bodies are accepted.\n\n**Required role:** none (no authentication needed).\n"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
            examples:
              activeDirectory:
                summary: Active Directory user
                value:
                  username: jsmith
                  domain: EXAMPLE
                  password: <password>
              withTotp:
                summary: User with an enrolled authenticator app
                value:
                  username: jsmith
                  domain: EXAMPLE
                  password: <password>
                  code: '123456'
              enrollTotp:
                summary: Confirm TOTP enrollment
                value:
                  username: jsmith
                  domain: EXAMPLE
                  password: <password>
                  key: JBSWY3DPEHPK3PXP
                  code: '123456'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthLoginRequest'
      responses:
        '200':
          description: 'Access granted, or the user must enroll a second factor. Check `code` in the body:
            when it is

            `2FA_Config_Required` no token is issued yet.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthLoginSuccess'
                - $ref: '#/components/schemas/AuthLoginEnrollmentRequired'
              examples:
                granted:
                  summary: Access granted
                  value:
                    message: Access granted.
                    token: <access-token>
                    expires: '2026-10-28T08:00:00.000Z'
                enrollment:
                  summary: TOTP enrollment required
                  value:
                    message: Auth Success; 2FA Configuration Required
                    key: JBSWY3DPEHPK3PXP
                    code: 2FA_Config_Required
        '301':
          description: 'SAML single sign-on succeeded. The `Location` header is `/#/login?samlAuth=<access-token>`;
            the

            response has no body.

            '
          headers:
            Location:
              description: Relative URL carrying the access token in the `samlAuth` query parameter.
              schema:
                type: string
        '302':
          description: 'SAML flow mismatch. The server redirects to the single sign-on page of the server
            (service-provider-initiated SSO is

            configured but the response was not a reply to a request) or to the identity provider entry
            point

            (identity-provider-initiated SSO is configured but the response carries `InResponseTo`).

            '
          headers:
            Location:
              schema:
                type: string
        '400':
          description: Bad request. Returned for a missing or empty `username` or `domain` (typed error,
            message `Invalid request.`), for a body that is not valid JSON (`{error}` with the parser
            message), for a key in the body that starts with `$` (typed error, name `InvalidQuery`), for
            the built-in service account when it is disabled (the response says it is disabled and the
            password must be set) or the password is wrong. An unsupported content type, such as `text/plain`,
            is also `Invalid request.`
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorTyped'
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/ErrorSimple'
        '401':
          description: 'Authentication failed. The body is `{message}` for most failures (`Sign In Failed`
            when the credentials are rejected, `Something went wrong, please try again.`, `Invalid token.`,
            `2FA Configuration Required`, `Challenge received from RADIUS server.`, and for SSO `User
            not found with <attribute>: <value> ...`). Some failures return the typed error shape instead.
            When a second-factor code is needed the body includes `code: 2FA_Token_Required`; send the
            request again with `code`.


            If the request also carries an invalid or expired token (an `Authorization` or `x-access-token`
            header, or a `token` field in the body or query) it fails with 401 (`jwt malformed`, `jwt
            expired`, `invalid token`) before the credentials are read. Do not send an old token when
            you sign in again.'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/AuthLoginTokenRequired'
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/ErrorTyped'
              examples:
                tokenRequired:
                  summary: Second-factor code required
                  value:
                    message: 2FA Token Required
                    code: 2FA_Token_Required
                badCode:
                  value:
                    message: Invalid token.
                staleToken:
                  summary: Expired token left in the Authorization header
                  value:
                    message: jwt expired
        '500':
          description: Server error, for example the directory server could not be reached, the RADIUS
            client failed, the SAML profile lacks the configured user identifier claim, or the access
            token could not be issued. A non-string `username` or `domain` also returns 500; send both
            as strings. The body is `{error}` or `{message}`.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/ErrorSimple'
        '504':
          description: The RADIUS server did not answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /api-keys:
    get:
      operationId: listApiKeys
      tags:
      - API keys
      summary: List API keys
      description: 'Returns the registered API keys, including revoked ones (check `isRevoked`). The key
        value itself

        (the JWT) is never returned after creation.

        The list is paged and supports `sort` and `inlinePageInfo`. You can also filter by any field of
        the record with an

        equality query parameter, for example `?appName=reporting-integration` or `?isRevoked=true`. An
        unknown field name returns

        400 `InvalidQuery`. `advanced` is ignored here, and `select` is rejected with 400 `InvalidQuery`.


        **Required role:** `superadmin` or `admin`.

        '
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/InlinePageInfoParam'
      responses:
        '200':
          description: A page of API keys.
          headers:
            X-Pagination-Count:
              $ref: '#/components/headers/X-Pagination-Count'
            X-Pagination-Max-Count:
              $ref: '#/components/headers/X-Pagination-Max-Count'
            X-Pagination-Page:
              $ref: '#/components/headers/X-Pagination-Page'
            X-Pagination-Pages:
              $ref: '#/components/headers/X-Pagination-Pages'
            X-Pagination-Total:
              $ref: '#/components/headers/X-Pagination-Total'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                anyOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/AuthApiKey'
                - allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuthApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: 'A query parameter is not a field of the record, or `select` was sent (`field "select":
            field name or value not allowed`), or a key in the query starts with `$`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: InvalidQuery
                message: 'field "select": field name or value not allowed'
    post:
      operationId: createApiKey
      tags:
      - API keys
      summary: Create an API key
      description: 'Creates an API key and returns it once. Store it securely; it cannot be retrieved
        again.


        An API key is a JWT that never expires and is not itself an access token. Exchange it for a short-lived

        access token with `POST /api-keys/auth`. Always send `linkedUsers`: the access token takes the
        role of

        the linked user, and a key with no linked user cannot authenticate.


        Must be called with an Active Directory user''s token; the built-in `secureone` account cannot
        create API

        keys (400, `createdBy` validation error).


        Both `application/json` and `application/x-www-form-urlencoded` bodies are accepted.


        **Required role:** `superadmin` or `admin`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthApiKeyCreateRequest'
            example:
              appName: reporting-integration
              linkedUsers:
              - 00000000000000000000000a
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthApiKeyCreateRequest'
      responses:
        '200':
          description: The API key was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiKeyCreated'
              example:
                apiKey: <api-key>
        '400':
          description: 'The key could not be created, for example `appName` is missing or already used
            (an `appName` must be unique), `linkedUsers` contains an unknown user id (`linkedUsers contains
            invalid userIDs`) or a value that is not a valid user id, `scopes` has an unsupported value,
            or the caller is the built-in `secureone` account

            (`createdBy contains invalid userID`). The `message` field can hold a structured validation
            object rather than a plain string.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiKeyError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api-keys/auth:
    post:
      operationId: authenticateApiKey
      tags:
      - API keys
      summary: Exchange an API key for an access token
      description: 'Send the API key as the bearer token (`Authorization: Bearer <api-key>`) together
        with the `userId` of

        one of the key''s linked users. The response is an access token with that user''s role, valid
        for the

        configured token lifetime (see `expires`).


        If the key was created with `scopes`, the access token is restricted: every route that is not
        tagged

        with one of the scopes returns 403 (`Scope not allowed by token`). The only useful scope is

        `system:register`, which limits the token to `POST /computers/register`. `system:ground_station`
        is accepted

        when creating a key, but no route in this product accepts it, so a token restricted to it cannot
        call anything.


        Both `application/json` and `application/x-www-form-urlencoded` bodies are accepted.


        **Required role:** none (authenticate with an API key).

        '
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthApiKeyAuthRequest'
            example:
              userId: 00000000000000000000000a
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AuthApiKeyAuthRequest'
      responses:
        '200':
          description: Access granted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthApiKeyToken'
              example:
                message: Access granted.
                token: <access-token>
                expires: '2026-10-28T08:00:00.000Z'
                scopes: []
        '400':
          description: '`userId` is missing, is not an object id, or is not one of the key''s linked users
            (`Invalid userId`). A key created without `linkedUsers` always gets this response.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '401':
          description: The token is not an API key (`This token type is not allowed.`), or it is expired,
            malformed or has a bad signature (`jwt expired`, `jwt malformed`, `invalid signature`). Also
            returned, as the typed shape, when the linked user exists but has no role (`Access has not
            been granted for this user.`).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/ErrorTyped'
        '403':
          description: 'The key is revoked or unknown (`This token is not a valid API key`) or the linked
            user no longer

            exists (`Requested user not found`).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '500':
          description: 'The access token could not be issued (`No cached linked user`). If no

            token is sent at all, the server returns 500 with the generic `{error}` body. Send the API
            key in the `Authorization: Bearer` header.

            '
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ErrorMessage'
                - $ref: '#/components/schemas/ErrorSimple'
  /api-keys/{appId}:
    delete:
      operationId: revokeApiKey
      tags:
      - API keys
      summary: Revoke an API key
      description: 'Revokes the key identified by `appId`. Access tokens already issued from the key stay
        valid until they

        expire; no new tokens can be issued. A revoked key cannot be restored and the record remains in
        the

        list with `isRevoked` set to true.


        **Required role:** `superadmin` or `admin`.

        '
      parameters:
      - name: appId
        in: path
        required: true
        description: The key's `appId` (a UUID v4), as returned by `GET /api-keys`. This is not the object
          id. A value that is not a known `appId`, including an object id or text that is not a UUID,
          returns 404 (never 400).
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: The key was revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No key has this `appId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '410':
          description: The key has already been revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '500':
          description: Unexpected error while revoking.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
  /ping:
    get:
      operationId: ping
      tags:
      - Health
      summary: Check that the API is reachable
      description: 'Returns `pong` and the server time. Needs no token. `POST /ping` behaves the same.
        Other methods return 405 with an empty body when a valid token is sent, and 401 without one.


        If a token is supplied anyway (an `Authorization` or `x-access-token` header, or a `token` field
        in the body or query string), it is still checked: an invalid or expired token returns 401, and
        an access token restricted by `scopes` returns 403 (`Scope not allowed by token`). Leave the token
        off when you only want to test reachability.


        **Required role:** none (no authentication needed).

        '
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPing'
              example:
                message: pong
                time: 1790000000000
        '401':
          description: A token was supplied and it is invalid or expired. The body is `{message}` (`jwt
            malformed`, `jwt expired`, `invalid token`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /computers:
    get:
      operationId: listComputers
      tags:
      - Computers
      summary: List computers
      description: 'Returns the computers (managed systems) in the inventory, one page at a time.


        **Required role:** `superadmin`, `admin` or `user`. When the "my systems" release toggle is on,
        a plain `user` in advanced mode sees only the systems that user can administer.


        There are three query modes, chosen by the query string:


        1. **IP lookup** (`ip` present). The server queues a DNS lookup job, waits for a worker to finish
        it, records the address as the computer''s `last_ip`, then returns the computers whose `cn` and
        `last_ip` start with the resolved values (case-insensitive prefix match). If no host name resolves,
        the response is an empty array.

        2. **Advanced** (`advanced` present and not `false`). Filters accept operators, `select` picks
        fields, and `retired` switches the collection that is searched.

        3. **Standard** (neither). Any other query parameter filters on a computer field as a case-insensitive
        starts-with match (`true`/`false` match booleans; send plain values). Operators and `select` are
        not available. An unknown field returns 400.


        Any query parameter that is not reserved (`page`, `limit`, `sort`, `inlinePageInfo`, `advanced`,
        `select`, `retired`, `ip`) is a filter on the field of the same name, using dot notation for nested
        fields (for example `policy.scan=true`, `os_type=linux`, `config.directory_bridging.strategy=sssd`).
        Any computer field that is not hidden can be filtered (dot notation for nested fields). Hidden
        fields, such as `objectGUID`, and non-string values return 400. Repeat a key as `field[]=a&field[]=b`
        for an in-list match.


        **Advanced operators** (value prefixes, advanced mode only; `^`, `$` and `~` match case-insensitively;
        equals, not-equal and in-list are exact, case-sensitive matches):


        | Prefix | Meaning | Example |

        |---|---|---|

        | (none) | equals | `cn=WEB01` |

        | `!` | not equal | `os_type=!windows` |

        | (empty value) | field exists | `last_ip=` |

        | `!` alone | field does not exist | `last_ip=!` |

        | `>` `>=` `<` `<=` | number or date comparison | `lastLogonTimestamp=>2026-01-01` |

        | `^` | starts with | `cn=^WEB` |

        | `$` | ends with | `cn=$01` |

        | `~` | contains | `cn=~eb0` |

        | `field[]=a&field[]=b` | in list | `os_type[]=linux&os_type[]=macos` |

        | `field[]=!a&field[]=!b` | not in list | `os_type[]=!linux` |


        Values are converted using the field type (string, number, boolean, date). Date fields also accept
        relative times such as `<=now-30d`.


        **Default fields** in a list response: `config`, `objectGUID`, `distinguishedName`, `cn`, `objectSid`,
        `domain_fqdn`, `domain_netbios`, `operatingSystem`, `policy`, `dNSHostName`, `last_ip`, `last_scanned`,
        `lastLogonTimestamp`, `lastScan`, `os_type`. In advanced mode `select` can also name `admins.current`.


        **Paging:** `limit`, `page` and `sort` apply in every mode. Add `inlinePageInfo` to wrap the array
        as `{limit, page, pages, total, links, docs}`. Out-of-range paging values are not rejected: a
        `limit` of `0`, a negative `limit` or a non-numeric `limit` returns an empty array (`X-Pagination-Max-Count:
        0`); a `limit` above 1000 is capped at 1000; a `page` below 1 or non-numeric is treated as page
        1; a `page` past the end returns an empty array; a `sort` on an unknown field is ignored.


        **Query errors:** in advanced mode an unknown `select` field or a field that cannot be selected,
        returns 500 rather than 400; send only fields that exist and can be returned. A filter on an unknown
        field returns 400 `InvalidQuery`.

        '
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/InlinePageInfoParam'
      - name: advanced
        in: query
        required: false
        description: 'Presence flag for this endpoint. Send `advanced`, `advanced=` or `advanced=true`
          to enable operators, `select` and `retired`. `advanced=false` keeps standard mode. It is not
          an expression.

          '
        allowEmptyValue: true
        schema:
          type: boolean
      - $ref: '#/components/parameters/SelectParam'
      - name: ip
        in: query
        required: false
        description: 'IPv4 address to resolve. Triggers a queued DNS lookup and returns the matching computers.
          The call blocks while a worker performs the lookup and returns 408 after 60 seconds if no worker
          answers. The value is not validated as an address (`ip=notanip` also queues the lookup and ends
          in 408). An empty `ip=` is not lookup mode: it is treated as a standard filter on a field named
          `ip` and returns 400.'
        schema:
          type: string
          example: 192.0.2.10
      - name: retired
        in: query
        required: false
        description: Advanced mode only. When the parameter is present, the search runs against retired
          (archived) computers instead of active ones. Each result's `old_id` is the original computer
          id; pass it as `targetComputerId` to `POST /computers/archived/{targetComputerId}/restore`.
          `id` is the archive record id. Retired results return `old_id` and not `config` by default (`select=config`
          does return it). Outside advanced mode the parameter returns 400 `InvalidQuery`.
        allowEmptyValue: true
        schema:
          type: string
      - name: cn
        in: query
        required: false
        description: Filter by computer name. Example of a field filter; any default field can be used
          the same way.
        schema:
          type: string
      - name: os_type
        in: query
        required: false
        description: Filter by operating system family.
        schema:
          type: string
          enum:
          - windows
          - linux
          - macos
      - name: domain_fqdn
        in: query
        required: false
        description: Filter by domain.
        schema:
          type: string
      responses:
        '200':
          description: 'A page of computers. Paging metadata is in the `X-Pagination-*` and `Link` headers.
            In advanced mode `X-Pagination-Count` carries the requested page size rather than the number
            of rows returned, and `X-Pagination-Max-Count` is not sent; standard mode sends both correctly.

            '
          headers:
            X-Pagination-Count:
              $ref: '#/components/headers/X-Pagination-Count'
            X-Pagination-Max-Count:
              $ref: '#/components/headers/X-Pagination-Max-Count'
            X-Pagination-Page:
              $ref: '#/components/headers/X-Pagination-Page'
            X-Pagination-Pages:
              $ref: '#/components/headers/X-Pagination-Pages'
            X-Pagination-Total:
              $ref: '#/components/headers/X-Pagination-Total'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/ComputersComputer'
                - allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: '#/components/schemas/ComputersComputer'
        '400':
          description: Unknown filter field or invalid query value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          description: The IP lookup (`ip` mode) did not finish in time. Body is a typed error with `name`
            `TimeoutError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          description: The query could not be run (for example `select` in advanced mode names an unknown
            field or a field that cannot be selected) or an unexpected error occurred. Send a valid `select`.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorTyped'
                - $ref: '#/components/schemas/ErrorSimple'
  /computers/archived/{targetComputerId}/restore:
    post:
      operationId: restoreArchivedComputer
      tags:
      - Computers
      summary: Restore an archived computer
      description: 'Moves a retired (archived) computer back into the active inventory under its original
        id. By default the archived copy is deleted after a successful restore.


        **Required role:** `superadmin` or `admin`.


        The route does not check the id first, so a malformed id returns 422 rather than the plain-text
        404.


        The restored computer keeps its original id. Without `preservecopy=true` the archived record is
        deleted after the 200 is sent. Restoring an id whose archived copy is still present while an active
        computer already has that id returns 409 with the message `Computer <id> is already active.`; an id with
        no archived copy returns 409 with the message `No stale computer with ID: <id>`.'
      parameters:
      - name: targetComputerId
        in: path
        required: true
        description: The original computer id (the `old_id` of the archived record).
        schema:
          type: string
          pattern: ^[0-9a-f]{24}$
          example: 00000000000000000000000a
      - name: active
        in: query
        required: false
        description: Use `true` (the default). `false` is reserved for retiring a computer and returns
          501. Any other value, such as `maybe`, is treated as `true`.
        schema:
          type: boolean
          default: true
      - name: preservecopy
        in: query
        required: false
        description: Keep the archived copy after restoring.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: The computer was restored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputersRestoreResponse'
              example:
                message: Computer restored as 00000000000000000000000a
                restoredId: 00000000000000000000000a
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: No archived computer with that id, or a computer with that id is already active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          description: 'The id is not a valid object id. Message: `Invalid RetiredComputer ID: "<id>"`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '500':
          description: The save failed unexpectedly.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorTyped'
                - $ref: '#/components/schemas/ErrorSimple'
        '501':
          description: '`active=false` was requested.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /computers/lookupids:
    post:
      operationId: lookupComputerIds
      tags:
      - Computers
      summary: Look up computer ids from names
      description: 'Resolves computer name and domain pairs to computer ids. `cn` and `domain_fqdn` are
        matched exactly (case-sensitive). Pairs with no match, including pairs whose `cn` is not a string,
        are returned in `notFound`. A pair sent twice is returned twice in `found`.


        **Required role:** `superadmin`, `admin` or `user`.


        The body can be JSON or urlencoded (`systemInfo[0][cn]=...&systemInfo[0][domain_fqdn]=...`); the
        nested array is practical only as JSON.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputersLookupIdsRequest'
            example:
              systemInfo:
              - cn: WEB01
                domain_fqdn: example.com
              - cn: DB01
                domain_fqdn: example.com
      responses:
        '200':
          description: Lookup result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputersLookupIdsResponse'
              example:
                found:
                - id: 00000000000000000000000a
                  cn: WEB01
                  domain_fqdn: example.com
                  organizationalUnit: CN=WEB01,CN=Computers,DC=example,DC=com
                  operatingSystem: Windows Server 2022 Standard
                notFound:
                - cn: DB01
                  domain_fqdn: example.com
        '400':
          description: Request body failed validation. Body is a typed error with `name` `ValidationError`
            and a `message`, for example when `systemInfo` is missing, is not an array, or an entry lacks
            `cn` or `domain_fqdn`. A request body containing a key that starts with `$` is also rejected
            as invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /computers/register:
    post:
      operationId: registerComputer
      tags:
      - Computers
      summary: Register a computer
      description: 'Registers a Windows, Linux or macOS computer, or re-registers one that is already
        in inventory. For Windows and Linux the call queues a registration scan and **waits up to 90 seconds**
        for it to finish, then applies the requested policy and persistent administrators.


        **Required role:**


        - A token with role `superadmin` or `admin`.

        - An access token from an API key with scope `system:register` is accepted on this route (scoped
        tokens are refused elsewhere), but its linked user must still be `superadmin` or `admin` unless
        the next rule applies.

        - When the `unauthenticated_registration_endpoints` feature is enabled, any caller is allowed,
        including a plain `user` or no token.


        Otherwise the call returns 403.


        **Per operating system**


        | Field | Windows | Linux | macOS |

        |---|---|---|---|

        | `system` | FQDN of a computer already in inventory (found by directory sync) | FQDN; created
        if new | FQDN; created if new |

        | `username`, `password` | required | required, unless the caller is an admin and a domain service
        account is configured for Linux (and not `nondomain`) | same rule, using the macOS configuration
        |

        | `secure` | allowed | allowed | rejected (422) |

        | registration scan | always | always | only when `scanNow` or `secure` is true; otherwise the
        call returns 201 with the new id |


        If a Windows computer is already registered, `persistent`, `scan` and `secure` are ignored. For
        Linux and macOS, only an admin can change the OS type, `nondomain` or `directory_bridging` of
        a computer that already exists.


        The body can be JSON or urlencoded. Booleans accept `true` or `false` as strings.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputersRegisterRequest'
            examples:
              windows:
                summary: Windows computer
                value:
                  system: web01.example.com
                  os_type: windows
                  username: <registration-account>
                  password: <registration-password>
                  scan: true
                  secure: false
                  persistent: EXAMPLE\jsmith
              linux:
                summary: Linux computer, domain joined
                value:
                  system: lnx01.example.com
                  os_type: linux
                  username: <registration-account>
                  password: <registration-password>
                  scan: true
                  directory_bridging: sssd
              macos:
                summary: macOS computer, register without a scan
                value:
                  system: mac01.example.com
                  os_type: macos
                  username: <registration-account>
                  password: <registration-password>
                  osVersion: '14.5'
                  serialNumber: <serial-number>
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Registration scan completed. The body is the last queue activity entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputersQueueActivity'
        '201':
          description: macOS only. Registered without a scan. The body is the new computer's id as a JSON
            string.
          content:
            application/json:
              schema:
                type: string
                example: 00000000000000000000000a
        '401':
          description: 'A token was sent but is invalid or expired (for example `jwt malformed`). A request
            with no token is not a 401 on this route: it returns 403 unless `unauthenticated_registration_endpoints`
            is enabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: jwt malformed
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          description: 'The registration scan did not complete within 90 seconds. Body is `{name: "TimeoutError",
            message: "Operation timed out"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          description: 'Missing `system` ("No system specified."); invalid `os_type` ("Invalid os_type.
            Must be one of linux, macos, windows"); missing credentials for a Windows computer ("Must
            provide username and password for registration."); the request cannot be processed for the
            supplied computer; unknown domain for Linux (`Unknown domain specified: "<domain>"`); a non-admin
            trying to change OS type, `nondomain` or bridging; protect mode on macOS ("Protect mode registration
            not yet supported for MacOS"); or the registration scan failed (`message` is then the worker
            activity message and `code` its activity code).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /computers/unregister:
    post:
      operationId: unregisterComputer
      tags:
      - Computers
      summary: Unregister a computer
      description: 'Removes the service account from the inventory record of a registered Windows computer.
        The call queues a job that checks the supplied credentials, **waits up to 90 seconds**, and on
        success removes the service account from the computer''s inventory record (the service account
        is dropped from its administrator list).


        **Required role:** `superadmin` or `admin`; any other caller (plain `user` or no token) only while
        `unauthenticated_registration_endpoints` is enabled. Scoped API-key tokens are rejected (403).


        The computer must already be registered. The lookup is by `system` (`<cn>.<domain_fqdn>`), case-insensitive.


        The body can be JSON or urlencoded.


        `username` and `password` are not validated up front: a request without them is queued and ends
        in the same 90 second timeout or scan failure. A `system` that matches no registered computer
        returns 422.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputersUnregisterRequest'
            example:
              system: web01.example.com
              username: <registration-account>
              password: <registration-password>
      security:
      - bearerAuth: []
      - {}
      responses:
        '200':
          description: Unregistered. The body is the last queue activity entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputersQueueActivity'
        '401':
          description: 'A token was sent but is invalid or expired (for example `jwt malformed`). A request
            with no token is not a 401 on this route: it returns 403 unless `unauthenticated_registration_endpoints`
            is enabled.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: jwt malformed
        '403':
          $ref: '#/components/responses/Forbidden'
        '408':
          description: 'The unregistration scan did not complete within 90 seconds. Body is `{name: "TimeoutError",
            message: "Operation timed out"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          description: Missing `system`, the request cannot be processed for the supplied computer (`Unable
            to process the request`), or the scan failed with the supplied credentials (`message` is the
            worker activity message and `code` its activity code).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /computers/{computerId}:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: getComputer
      tags:
      - Computers
      summary: Get a computer
      description: 'Returns one computer, including its administrators (`admins.current`), policy and
        configuration. Secrets (service account passwords, key material, password values) are never returned.
        Password history is returned as metadata only: each `admins.managed_sids[].password_history` entry
        carries `_id` and `timestamp`, and `current_password_id` names the active entry; the encrypted
        values are removed. `service_acct` is returned as `{username}` when a service account is set.


        **Required role:** `superadmin`, `admin`, or a `user` who is a local administrator of this computer
        (directly or through a group). Any other `user` gets 403.

        '
      responses:
        '200':
          description: The computer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputersComputer'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
    patch:
      operationId: updateComputer
      tags:
      - Computers
      summary: Update a computer
      description: 'Changes a computer''s policy, directory bridging or EDR integration. The first matching
        rule wins:


        1. If the body contains a non-empty `ip`, only the last known IP address is updated and the rest
        of the body is ignored. A plain `user` may do this only for a computer that user can administer
        (directly or through a group); otherwise 403. An `ip` that is empty or `null` is ignored and the
        request falls through to rule 2.

        2. Otherwise the caller must be `superadmin` or `admin` (403 for a plain `user`), and `policy`,
        `directory_bridging` / `system_domain` and `edr_integration` are applied together in one save.


        Notes on the body:


        - `edr_integration` is a **top-level** field in the request body holding the id of an EDR configuration.
        The server stores it at `config.policies.edr_integration`, and that is where responses show it.
        The id must be a valid 24-character object id (anything else, including an empty string, returns
        400 `ValidationError`) but it is stored without checking that the EDR configuration exists.

        - `policy.manage_local_sids` is accepted but ignored; the stored value is kept.

        - `policy.strict_secure` can be `true` only while protect mode (`policy.secure`) ends up `true`.

        - Scan mode cannot be turned off while offline access management is enabled on the computer.

        - `directory_bridging` and `system_domain` apply to Linux and macOS computers only (422 otherwise).
        `system_domain` is required when `directory_bridging` is `centrify`, `powerbroker`, `sssd` or
        `directory_utility`, and must name a configured directory (LDAP) domain. For `secureone` or `none`
        the domain is cleared and the computer is marked non-domain. `system_domain` without `directory_bridging`
        returns 422.

        - Changing `policy` on a Linux computer also stages or applies sudoers policy.


        The body can be JSON or urlencoded (nested keys such as `policy[scan]=true` work). A body sent
        with any other content type is not parsed and the request is treated as an empty update. An empty
        update (`{}`, or fields the route does not know) saves nothing new and returns the computer with
        200. Unknown fields such as `cn` are ignored. Boolean policy values sent as the strings `"true"`
        or `"false"` are accepted; a `policy` value that is not an object is ignored. Malformed JSON returns
        400 with `{error}`.


        **Required role:** any authenticated user for an `ip` update of a computer the user administers;
        otherwise `superadmin` or `admin`.

        '
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ComputersUpdateRequest'
            examples:
              policy:
                summary: Turn on scan and protect mode
                value:
                  policy:
                    scan: true
                    secure: true
                    strict_secure: false
              bridging:
                summary: Set directory bridging on a Linux computer
                value:
                  directory_bridging: sssd
                  system_domain: example.com
              edr:
                summary: Attach an EDR configuration
                value:
                  edr_integration: 00000000000000000000000b
              ip:
                summary: Record the IP address only
                value:
                  ip: 192.0.2.10
      responses:
        '200':
          description: 'Success. When only `ip` was sent the body is `{message}`; otherwise it is the
            full updated computer.

            '
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ComputersComputer'
                - $ref: '#/components/schemas/ErrorMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          description: 'Conflict, with a `{message}` body: `strict_secure` requested while protect mode
            is off, or scan mode disabled while offline access management is enabled.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
        '422':
          description: 'Invalid `ip` (anything that is not a dotted IPv4 address, including IPv6 and numbers);
            directory bridging options sent for a Windows computer; unknown `system_domain` ("Invalid
            domain specified for the system"); `directory_bridging` of `sssd`, `centrify`, `powerbroker`
            or `directory_utility` without a valid `system_domain`; or `system_domain` without `directory_bridging`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '400':
          description: 'Validation failed while saving: `directory_bridging` is not one of the allowed
            values, or `edr_integration` is not a valid object id (body `{name: "ValidationError", message}`);
            or the JSON body is malformed (body `{error}`).'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorTyped'
                - $ref: '#/components/schemas/ErrorSimple'
  /computers/{computerId}/flattened-accounts:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: listComputerFlattenedAccounts
      tags:
      - Computers
      summary: List flattened accounts for a computer
      description: 'Returns the directory accounts that have administrator rights on the computer, both
        directly and through nested group membership. Direct entries have `isDirect: true`. Service accounts
        are excluded. The response is not paged.


        **Required role:** `superadmin` or `admin`.

        '
      parameters:
      - name: accountTypes
        in: query
        required: false
        description: 'Limit results to these account types: `computer`, `group`, `user`. Separate values
          with any non-letter character (comma, space, and so on); matching is case-insensitive. Any other
          value returns 422.

          '
        schema:
          type: string
          example: user,group
      - name: sAMAccountName
        in: query
        required: false
        description: Case-insensitive "starts with" filter value for `sAMAccountName`. Send a plain account-name
          prefix.
        schema:
          type: string
      - name: userId
        in: query
        required: false
        description: Return only the account with this object id. A value that matches no account (including
          a malformed id) returns an empty array.
        schema:
          type: string
      - name: memberDn[]
        in: query
        required: false
        description: 'Return only groups that contain one of these distinguished names. Clients must send
          the literal key `memberDn[]` (`memberDn[]=CN=...`), even for a single value; a plain `memberDn=`
          value returns 422.

          '
        schema:
          type: array
          items:
            type: string
        style: form
        explode: true
      responses:
        '200':
          description: Matching accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputersFlattenedAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          description: An `accountTypes` value is not `computer`, `group` or `user`, or `memberDn` is
            not an array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '500':
          description: The server returns 500 when the `sAMAccountName` value cannot be processed as a
            filter. Body is the generic `{error}` shape. Send a plain account-name prefix to avoid it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /computers/{computerId}/history:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: getComputerHistory
      tags:
      - Computers
      summary: Get access history for a computer
      description: 'Returns every queue job for the computer (access requests, refreshes, registration
        and other jobs; see `request.type`) plus managed account password events, newest first by `processed`.
        The response is not paged.


        **Required role:** `superadmin`, `admin`, or a `user` who is a local administrator of this computer.


        When the computer has an EDR configuration with investigation enabled, entries of type `access`
        include an `investigation` window (device name, start, end).


        A job that has not been processed yet has no `processed` value. Managed account events carry their
        `comment` inside the single `request.activity` entry and have no top-level `comment`.

        '
      responses:
        '200':
          description: History entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputersHistoryEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
  /computers/{computerId}/access:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: requestComputerAccess
      tags:
      - Computers - Access
      summary: Request just-in-time administrator access to a computer
      description: "**Deprecated:** use `POST /computers/{computerId}/access` instead; it takes the same\
        \ parameters in the request body.\n\nCreates a JITA access request that adds the caller (or, for\
        \ an admin, another user) to the\nlocal administrators of the computer. The request is queued\
        \ for a worker; for a request made for yourself, poll `GET /queue/pending/{systemId}` to follow\
        \ it. Until a worker picks it up, the request stays `pending`.\n\nParameters are read from the\
        \ query string on GET and from the request body on POST (JSON or\nurlencoded). The POST form is\
        \ functionally identical, and a POST with no body at all is accepted\n(all defaults). `t` sent\
        \ as a numeric string in a JSON body (\"30\") is accepted.\n\n**Who can call it**\n- Any authenticated\
        \ role (`superadmin`, `admin`, `user`) may request access for themselves, provided\n  they are\
        \ a system administrator of the computer: a direct entry in the computer's admin\n  inventory,\
        \ or a member of a group in it (the request then records `accessViaGroup`). Otherwise the response\
        \ is 403.\n- The built-in `secureone` account is not a directory user, so it gets 422 `User not\
        \ found` here.\n  A `superadmin` token that belongs to a real directory user works for self requests\
        \ like any other role.\n- Requesting on behalf of another user (`userId` differs from the caller)\
        \ requires the caller's\n  role to be exactly `admin`. `user` and `superadmin` tokens get 403\
        \ (checked before the target is\n  looked up). A `userId` equal to the caller's own id is a self\
        \ request. For an `admin` caller, a malformed\n  `userId` is 422 `Invalid User ID: \"<value>\"\
        `, an unknown one 422 `User not found`, and a user who is not a\n  system administrator of the\
        \ computer 422 `The target user with ID '<id>' is not a system administrator.`\n\n**Duration (`t`)**:\
        \ a positive number of minutes. The default and maximum come from\nserver feature settings (both\
        \ 240 when unset). A value above the maximum, a negative value, or a\nnon-integer number (for\
        \ example `1.5`) returns 400 `InvalidQuery` 'Invalid Access Duration Requested.'. A value that\
        \ is\nabsent, empty, `0`, or not numeric (`abc`) is silently replaced with the default (this differs\
        \ from the extend endpoint,\nwhich also defaults values above the maximum).\n\n**Conflicts (409)**:\
        \ `Access has already been requested to this computer.` while the earlier request is pending,\
        \ and\n`Access has already been granted to this computer.` once it is active. Both carry `context.id`\
        \ and `context.expires`.\n\n**Linux and macOS**: for macOS computers and Linux computers using\
        \ Netwrix directory bridging, the\naccess token must carry the caller's encoded password (`encpass`);\
        \ otherwise 409 `Missing encpass in token for access request.`\nOn-behalf requests are not supported\
        \ for those systems (422 `JITA requests on behalf of another user are not supported for Mac systems\
        \ and Linux systems using Netwrix directory bridging.`).\nA Linux computer whose bridging strategy\
        \ is not `secureone` has neither restriction. PUT and DELETE return 405 with an empty body.\n\n\
        **Required role:** any authenticated user (on-behalf requests need `admin`).\n"
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CompAccessDuration'
      - $ref: '#/components/parameters/CompAccessComment'
      - $ref: '#/components/parameters/CompAccessTargetUserId'
      responses:
        '200':
          $ref: '#/components/responses/CompAccessRequested'
        '400':
          $ref: '#/components/responses/CompBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          $ref: '#/components/responses/CompAccessConflict'
        '422':
          description: 'Unprocessable: `User not found` (unknown caller or `userId`, including the built-in
            secureone account), `Invalid User ID: "<value>"` (malformed `userId`), the target user is
            not a system administrator of the computer, or an on-behalf request for a Mac or Netwrix-bridged
            Linux computer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: UnprocessableEntityError
                message: 'Invalid Computer ID: "123"'
      deprecated: true
    post:
      operationId: requestComputerAccessPost
      tags:
      - Computers - Access
      summary: Request just-in-time administrator access to a computer (POST form)
      description: 'Same behavior, authorization, and responses as `GET /computers/{computerId}/access`,
        with the parameters

        supplied in the request body (JSON or `application/x-www-form-urlencoded`) instead of the query
        string. An empty body is accepted and uses the defaults. Malformed JSON gives 400 with an untyped
        `{error}` body.


        **Required role:** any authenticated user (on-behalf requests need `admin`).

        '
      security:
      - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompAccessRequestBody'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompAccessRequestBody'
      responses:
        '200':
          $ref: '#/components/responses/CompAccessRequested'
        '400':
          $ref: '#/components/responses/CompBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          $ref: '#/components/responses/CompAccessConflict'
        '422':
          description: Same 422 variants as `GET /computers/{computerId}/access`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: UnprocessableEntityError
                message: 'Invalid Computer ID: "123"'
  /computers/{computerId}/expire:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: expireComputerAccess
      tags:
      - Computers - Access
      summary: End an active access session immediately
      description: 'Expires the active JITA session of the caller (or, for an admin, of the user named
        by `userId`) on the

        computer. The session expiry is moved to now and a worker removes the account from the local administrators
        group shortly after.


        Authorization is the same as for the access request: callers act on their own session; acting
        for

        another user requires the `admin` role (`user` and `superadmin` tokens get 403) and the target
        must be a system

        administrator of the computer (otherwise 422). The `t` parameter is accepted by the shared parser
        but

        ignored here.


        Returns 422 `No existing access requests found.` when the target user has no session in the expiring
        (active) state; a

        session that is still `pending` does not count. The call is idempotent: repeating it while the
        session is still listed

        as expiring returns 200 again. Only GET is routed; POST returns 405.


        **Required role:** any authenticated user (on-behalf requests need `admin`).

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/CompAccessTargetUserId'
      - $ref: '#/components/parameters/CompAccessComment'
      responses:
        '200':
          description: Expiration requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompSessionResult'
              example:
                id: 00000000000000000000000a
                message: Expiring session.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          description: No session in the expiring state (`No existing access requests found.`), or the
            on-behalf target is not a system administrator of the computer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
              example:
                name: UnprocessableEntityError
                message: 'Invalid Computer ID: "123"'
  /computers/{computerId}/extend:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: extendComputerAccess
      tags:
      - Computers - Access
      summary: Extend an active access session
      description: 'Adds time to the active JITA session of the caller (or, for an admin, of the user
        named by `userId`).


        A session can be extended only during the final 60 minutes before it expires. Earlier, or after
        expiry, the response is

        409 `Extend operation must occur within 60 minutes of expiration.` `t` is the number of minutes
        to add. If `t` is absent,

        not numeric, not greater than 0, or greater than the maximum session duration (default 240 minutes),
        the default (240 minutes

        unless configured otherwise) is used silently; no error is returned for an invalid `t`. Fractional
        values are accepted as sent:

        `t=1.5` adds 1.5 minutes and the message reads `Session time extended by 1.5 minutes.` `t=240`
        is accepted and `t=241` falls back to 240.


        Returns 422 `No existing access requests found.` when the target user has no session in the expiring
        (active) state; a

        pending session does not count. Authorization for acting on behalf of another user is the same
        as for the access request

        (role exactly `admin`; `user` and `superadmin` tokens get 403). Only GET is routed.


        **Required role:** any authenticated user (on-behalf requests need `admin`).

        '
      security:
      - bearerAuth: []
      parameters:
      - name: t
        in: query
        required: false
        description: Minutes to add. Invalid or out-of-range values fall back to the configured default
          (240).
        schema:
          type: number
          default: 240
      - $ref: '#/components/parameters/CompAccessTargetUserId'
      responses:
        '200':
          description: Session extended.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompSessionResult'
              example:
                id: 00000000000000000000000a
                message: Session time extended by 240 minutes.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          description: The session is more than 60 minutes from expiring, or has already expired (`Extend
            operation must occur within 60 minutes of expiration.`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /computers/{computerId}/admins:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: listComputerAdmins
      tags:
      - Computers - Admins
      summary: List the administrators in a computer's inventory
      description: 'Returns the accounts in the computer''s admin inventory, merged with accounts that
        currently hold an active

        JITA session (flagged `active: true` with `expiring` set; `accessViaGroup` is the group document
        when access came through a group). Active sessions for accounts not in the inventory

        are appended as additional entries with `persistent: false`; those entries carry only `domain`,
        `domainandname`, `sidusage`, `user`,

        `svc_acct`, `sid`, `onHost`, `active`, `session_initiated`, `expiring`, `userId` and `persistent`.
        The list is a bare array and is not paged: `limit` and `page` are ignored.


        The route is open to all roles, but a caller whose role is `user` must be a system administrator
        of the

        computer (direct entry or via a group); otherwise 403. A user-role caller who is a system administrator
        sees the whole list.


        **Required role:** `superadmin` or `admin`; user only if a system administrator of this computer.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Administrators of the computer.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ComputersAdmin'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          $ref: '#/components/responses/Unprocessable'
    post:
      operationId: addComputerAdmin
      tags:
      - Computers - Admins
      summary: Add an administrator to a computer's inventory
      description: 'Adds a directory user, group, or computer account to the inventory of accounts that
        may request

        administrator access to this computer. The `id` is looked up as a user, then a group, then a computer,
        and

        the matched object must have a SID. `persistent` defaults to false; a value that is not a boolean
        or the strings `true` or `false`

        (for example `"yes"`) is stored as false.


        On Linux computers the matching sudoers entries are added too. `sudo_permissions` is the privilege
        part of a sudoers line, for example

        `ALL=(root) /usr/bin/systemctl restart nginx`: the sudoers service prefixes each line with the
        account (`name ` for a user, `%name ` for a group), so sending a full line

        duplicates the name. Without it the service writes `<user> ALL=(ALL) NOPASSWD:ALL` (a group gets
        `%<group> ALL=(ALL) NOPASSWD:ALL`). If the computer has no sudoers yet the inventory

        entry is still added and no sudoers line is written. `sudo_permissions` is rejected (409 `Sudoers
        isn''t supported for non-Linux systems.`) on non-Linux computers, and that check runs before the
        `id` is validated.

        On Linux, the account name must be unique among current admins (409), and with Netwrix directory
        bridging a domain account

        cannot be persistent (422 with a message that a domain account on a Netwrix-bridged computer cannot
        be persistent).


        Errors: a missing or blank `id` is 422 `Missing required parameters`; a malformed id is 422 `Invalid
        User ID: "<value>"`; a well-formed

        id that matches nothing is 422 `Invalid Admin ID`; an account already in the inventory is 409
        `Administrator already exists in inventory`.

        400 occurs only on Linux when the sudoers service rejects the update.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: JSON, or `application/x-www-form-urlencoded` with the same fields.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompAdminAddRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompAdminAddRequest'
      responses:
        '200':
          description: Administrator added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Successfully added administrator
        '400':
          description: 'Linux only: the sudoers service rejected the update (`BadRequestError`). Missing
            or malformed `id` is 422, not 400.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    patch:
      operationId: updateComputerAdmin
      tags:
      - Computers - Admins
      summary: Set the persistent flag of an inventory administrator
      description: 'Marks an inventory administrator as persistent (always a local administrator, never
        removed after a

        session) or not. Identify the account with `sid`, or with `id` (user, group, or computer object
        id).

        When both are sent, `sid` wins. `persistent` is required and must be a boolean (or the string
        `true` or

        `false` when urlencoded); any other value, a missing `persistent`, or neither `sid` nor `id`,
        is 422 `Missing required parameters`.

        A malformed `id` is 422 `Invalid User ID: "<value>"`; an unknown one 422 `Invalid Admin ID`.


        Returns 409 `Administrator not in inventory` if the account is not in the inventory, and 422 if
        persistence is not allowed (Linux with

        Netwrix directory bridging and a domain account: a message that a domain account on a Netwrix-bridged
        computer cannot be persistent).


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompAdminUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompAdminUpdateRequest'
      responses:
        '200':
          description: Administrator updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Successfully updated administrator
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
    delete:
      operationId: removeComputerAdmin
      tags:
      - Computers - Admins
      summary: Remove an administrator from a computer's inventory
      description: 'Removes an account from the inventory. The account is identified in the request body
        (not the query string)

        by `sid`, or by `id` (user, group, or computer object id); `sid` wins when both are sent. A DELETE
        with no body, or with

        the id only in the query string, is 422 `Missing required parameters`. On Linux computers the
        account''s sudoers entries are removed as well.

        There is no protection for the built-in administrator: removing the default admin account succeeds
        with 200.


        Returns 409 `Administrator not in inventory` when the account is not in the inventory.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        description: JSON or urlencoded body on a DELETE request. Some HTTP clients and proxies drop DELETE
          bodies; send Content-Type explicitly.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompAdminRemoveRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompAdminRemoveRequest'
      responses:
        '200':
          description: Administrator removed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Successfully removed administrator
        '400':
          description: 'Linux only: the sudoers service rejected the update. Missing parameters are 422.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /computers/{computerId}/managed-sids/{adminSid}/force-password-rotation:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    - name: adminSid
      in: path
      required: true
      description: SID of an inventory administrator whose password is managed.
      schema:
        type: string
        example: S-1-5-21-1111111111-2222222222-3333333333-500
    post:
      operationId: forceManagedPasswordRotation
      tags:
      - Computers - Passwords
      summary: Flag a managed local account for password rotation
      description: 'Marks the account so its password is rotated at the next scan of the computer (sets
        `force_expiry` on the managed SID, visible in the computer details). No request body.


        Checks run in this order: domain controller (422 `PasswordManagementNotSupportedError`); Offline
        Access Management policy enabled (422 `Offline Access Management is not enabled`);

        the account is in the admin inventory (422 `Invalid Admin ID`); the account has managed-password
        state (422 `Admin has no passwords to rotate`).


        Same role gating as the password retrieval endpoint: `superadmin` and `admin`; `user` only with
        the

        policy flag `jita_or_persistent_users_can_access_passwords` and as a system administrator of the
        computer (403 otherwise).

        The built-in `secureone` account gets a 500 error (generic `{error}` body) after the flag is already
        saved. Use a token for a directory user.

        Only POST is routed (GET is 405).


        **Required role:** `superadmin` or `admin`; user only with the OAM policy flag and system-administrator
        status.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Rotation flagged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Password rotation requested for EXAMPLE-PC\Administrator (S-1-5-21-1111111111-2222222222-3333333333-500)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          description: Unexpected error, returned in the generic `{error}` body. The built-in secureone
            account (not a directory user) gets this response; the rotation flag is saved before the audit
            log write fails.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /computers/{computerId}/managed-sids/{adminSid}/password-history/{passwordHistoryId}/password:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    - name: adminSid
      in: path
      required: true
      description: SID of a managed local account on the computer.
      schema:
        type: string
        example: S-1-5-21-1111111111-2222222222-3333333333-500
    - name: passwordHistoryId
      in: path
      required: true
      description: Id of an entry in the account's `password_history`, as returned by the computer details
        endpoint. An id that matches no entry returns 409 `Invalid Admin Password`.
      schema:
        type: string
        example: 00000000000000000000000b
    get:
      operationId: getManagedPassword
      tags:
      - Computers - Passwords
      summary: Retrieve a managed local-account password from history
      description: "Returns the decrypted password recorded under `passwordHistoryId` for a local account\
        \ that is, or was,\nmanaged by Netwrix Privilege Secure for Discovery. The body is a JSON string,\
        \ for example `\"s3cret\"`.\nEach retrieval is written to the audit log with the optional `comment`.\n\
        \n**Who can call it**\n- `superadmin` and `admin` tokens that belong to a directory user always.\n\
        - `user` only if the computer's Offline Access Management policy has\n  `jita_or_persistent_users_can_access_passwords`\
        \ set to true (403 otherwise) and the user is a system\n  administrator of the computer (403 otherwise).\n\
        - The built-in `secureone` account gets a 500 error (generic `{error}` body) because the audit\
        \ log needs a directory user record; the password is not returned.\n\n`comment` is required (422\
        \ `Comment required to access password`) when the feature setting `password_comments` is enabled.\n\
        Not supported on domain controllers (422 `PasswordManagementNotSupportedError`).\n\nAn unknown\
        \ or malformed `passwordHistoryId`, or an entry with no stored password, is 409 `Invalid Admin\
        \ Password`. An `adminSid` that is a current\nadministrator but not a managed SID is 422 `Invalid\
        \ Admin ID`. An `adminSid` that is neither a managed SID nor a current administrator returns 500\
        \ (generic `{error}` body); send an `adminSid` that is a managed SID.\n\n**Required role:** `superadmin`\
        \ or `admin`; user only with the OAM policy flag and system-administrator status.\n"
      security:
      - bearerAuth: []
      parameters:
      - name: comment
        in: query
        required: false
        description: Reason for the retrieval, recorded in the audit log. Required when password comments
          are enabled.
        schema:
          type: string
      responses:
        '200':
          description: The decrypted password as a JSON string.
          content:
            application/json:
              schema:
                type: string
              example: <password>
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '409':
          description: '`Invalid Admin Password`: the `passwordHistoryId` does not match any entry of
            the account (any unknown or malformed value), or the entry has no stored password.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          description: The server returns 500 (generic `{error}` body) for an `adminSid` that is neither
            a managed SID nor a current administrator, and for the built-in secureone account. Send a
            valid `adminSid` and use a directory user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorSimple'
  /computers/{computerId}/offline-access-management:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    post:
      operationId: setOfflineAccessManagement
      tags:
      - Computers - Offline Access Management
      summary: Enable, disable, or configure Offline Access Management on a computer
      description: 'Sets the computer''s Offline Access Management (OAM) policy, which creates and manages
        an alternate local

        administrator account, optionally disables the built-in administrator, and rotates their passwords.
        Only POST is routed.


        `enabled` is required and must be a boolean (or `true`/`false` when urlencoded); anything else
        is 422 `Invalid value. "enabled" must be true or false.`

        If the computer already has an OAM strategy and the body contains only `enabled`, just the on/off
        state changes.

        Otherwise the policy is rebuilt from `strategy` (default `os-best-practice`; an unknown value
        is 422):


        | Strategy | use_alternate_admin | manage_built_in_admin_password | disable_built_in_admin | jita_or_persistent_users_can_access_passwords
        |

        |---|---|---|---|---|

        | `os-best-practice` | true (fixed) | true (fixed) | true (fixed) | false (fixed) |

        | `managed-built-in` | false (fixed) | true (fixed) | false (fixed) | optional, default false
        |

        | `custom` | required | required | required | optional, default false |


        For the two named strategies, supplying a boolean that contradicts a fixed value returns 422 `One
        or more conflict with named strategy: [<field>]`; for `os-best-practice`

        that includes `jita_or_persistent_users_can_access_passwords: true`. For `custom`,

        the three required booleans must be present, `manage_built_in_admin_password` cannot be false
        unless

        `use_alternate_admin` is true, and `disable_built_in_admin` cannot be true unless `use_alternate_admin`

        is true.


        `break_glass_account_name_template` defaults to `S1_ALT_ADMIN`. Each `?` is replaced with a random
        letter or digit (for example `FXBG_????` gives `FXBG_kmNI`); `*` is not a wildcard. The chosen
        name is stored as `break_glass_account_name`

        and is kept while the template still matches it.


        Not supported on domain controllers (422 `PasswordManagementNotSupportedError`), and cannot be
        enabled while Scan is disabled for the computer (422 `PasswordManagementNotSupportedError`, ''Cannot
        enable Offline Access Management policy when Scan is disabled.''); disabling while Scan is off
        succeeds.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompOamRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompOamRequest'
      responses:
        '200':
          description: Policy saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessage'
              example:
                message: Successfully enabled Offline Access Management policy.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /computers/{computerId}/sudoers:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    get:
      operationId: getComputerSudoers
      tags:
      - Computers - Sudoers
      summary: Get the last-scanned and staged sudoers for a Linux computer
      description: 'Returns the sudoers last seen by a scan (`lastScanSudoers`) and the sudoers staged
        as the desired state for

        Protect mode (`stagedSudoers`). Either is `null` when absent. When a staged document exists it
        is the one

        enforced once Protect is enabled; otherwise the last scanned document is used. Include files are
        flattened

        into one document. Timestamps are HTTP-date strings (`Tue, 27 Oct 2026 22:03:28 GMT`), not ISO
        8601, and the blob has no trailing newline.

        `createdById` is `null` for a scan document and `createdByName` is absent then.


        Returns 400 `Can only request sudoers content for Linux systems` for a non-Linux computer. Errors
        from the sudoers service are passed through with that

        service''s status and a `{message}` body.


        The server returns 500 (generic `{error}` body) for every caller when the staged sudoers was created
        by the built-in `secureone` account, because that account is not a directory user; stage a new
        sudoers with a directory user to avoid it.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sudoers documents.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompSudoersState'
        '400':
          $ref: '#/components/responses/CompBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        default:
          $ref: '#/components/responses/CompSudoersServiceError'
    post:
      operationId: setComputerSudoers
      tags:
      - Computers - Sudoers
      summary: Stage a desired-state sudoers file for a Linux computer
      description: 'Stores the supplied full sudoers text as the staged (desired-state) sudoers. It replaces
        any earlier staged

        document; individual lines cannot be patched. Nothing is written to the computer until Protect
        is enabled

        (or, if Protect is already on, until the next sync). Accounts named in the sudoers are reflected
        in the

        admin inventory, and inventory changes are reflected in the staged sudoers (inventory entries
        not named in the new text are dropped). The text is parsed with a trailing newline removed; the
        hash identifies the content.


        Returns 400 if `sudoers_blob` is missing or empty, or the computer is not Linux. A non-string
        `sudoers_blob` (for example `123`) is passed to the sudoers service and ends in 500. Errors from
        the sudoers service are passed through with that

        service''s status and a `{message}` body.


        The server returns 500 when the request is made with the built-in `secureone` account: the staged
        document is created and then the call fails, and later GET and DELETE calls return 500 until a
        directory user stages a new sudoers; use a directory user''s token to avoid it. Also, when

        the service fails downstream (for example a missing service-account password), the staged document
        is still saved on the computer.

        Accepts JSON and `application/x-www-form-urlencoded`.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompSudoersCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CompSudoersCreateRequest'
      responses:
        '200':
          description: Staged sudoers stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompSudoersCreateResponse'
        '400':
          $ref: '#/components/responses/CompBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        default:
          $ref: '#/components/responses/CompSudoersServiceError'
    delete:
      operationId: deleteComputerStagedSudoers
      tags:
      - Computers - Sudoers
      summary: Discard the staged sudoers for a Linux computer
      description: 'Deletes the staged sudoers so the computer falls back to the last scanned sudoers,
        and refreshes the admin

        inventory from it. `sudoersHash` must equal the hash of the currently staged document.


        Checks run in this order: non-Linux (400 `Can only unstage sudoers content for Linux systems`);
        Protect enabled, meaning Scan and Secure are both on (409 `Cannot delete staged sudoers when Protect
        is enabled`, nothing can be discarded while Protect is

        on, even with no hash); missing `sudoersHash` (400); hash mismatch (409 `Provided hash of <x>
        does not match found hash of <y>`); no staged document (404 JSON `NotFoundError` `No Staged Sudoers
        Exists`, whatever hash was sent).


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: sudoersHash
        in: query
        required: true
        description: Hash of the staged sudoers to delete, from `stagedSudoers.sudoersHash`.
        schema:
          type: string
      responses:
        '200':
          description: Staged sudoers discarded. The body is an empty JSON object.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
        '400':
          $ref: '#/components/responses/CompBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Either the computer id is invalid (plain-text `Invalid Computer ID`) or no staged
            sudoers exists (JSON `ErrorTyped`, name `NotFoundError`).
          content:
            text/plain:
              schema:
                type: string
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/CompSudoersServiceError'
  /computers/{computerId}/sudoers/admin/{adminSid}:
    parameters:
    - $ref: '#/components/parameters/ComputersComputerIdParam'
    - name: adminSid
      in: path
      required: true
      description: SID of an administrator in the computer's inventory.
      schema:
        type: string
        example: S-1-5-21-1111111111-2222222222-3333333333-1001
    get:
      operationId: getComputerAdminSudoers
      tags:
      - Computers - Sudoers
      summary: Get the sudoers entries that apply to one inventory administrator
      description: 'Returns the sudoers entries that grant the account privileges, including entries reached
        through user

        lists, user aliases, and domain groups the account belongs to. Local group membership is not included.
        Accounts are addressed by their inventory SID, which for local Linux accounts looks like `uid:1001`.


        If the sudoers service rejects the request (for example, the computer is not Linux, the account
        is

        not a user or group, the SID is not in the inventory, or no sudoers exists), the server does not
        report it: the response is 200 with an empty

        body and no Content-Type. Only GET is routed.


        **Required role:** `superadmin` or `admin`.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Privileges for the account, or an empty body when the sudoers service returned
            an error.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CompSudoersPrivilege'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
  /systems/authorized:
    get:
      tags:
      - Systems
      operationId: checkSystemAuthorized
      summary: Check whether a user is authorized on a system
      description: 'Evaluates whether the named user has administrative access to the named system and
        returns

        a boolean. Identify the user with `user[...]` parameters and the system with

        `computer[...]` parameters (nested query syntax). Both are required. Keys are

        case-insensitive.


        User keys: `id`, `sid`, `dn` (aliases for `_id`, `objectSid`, `distinguishedName`),

        `domainAndName` (`DOMAIN\sAMAccountName`).

        Computer keys: the same four plus `dNSHostName` and `cn`.

        Example: `?user[sid]=S-1-5-21-1111111111-2222222222-3333333333-1001&computer[dNSHostName]=host01.example.com`


        **Required role:** `admin` or `superadmin`.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: user
        in: query
        required: true
        style: deepObject
        explode: true
        description: Identifies the user. Supply at least one key.
        schema:
          type: object
          additionalProperties:
            type: string
          properties:
            id:
              type: string
              example: 00000000000000000000000a
            sid:
              type: string
              example: S-1-5-21-1111111111-2222222222-3333333333-1001
            dn:
              type: string
              example: CN=Example User,OU=Users,DC=example,DC=com
            domainAndName:
              type: string
              example: EXAMPLE\euser
      - name: computer
        in: query
        required: true
        style: deepObject
        explode: true
        description: Identifies the system. Supply at least one key.
        schema:
          type: object
          additionalProperties:
            type: string
          properties:
            id:
              type: string
              example: 00000000000000000000000b
            sid:
              type: string
              example: S-1-5-21-1111111111-2222222222-3333333333-1002
            dn:
              type: string
            domainAndName:
              type: string
              example: EXAMPLE\HOST01
            dNSHostName:
              type: string
              example: host01.example.com
            cn:
              type: string
              example: HOST01
      responses:
        '200':
          description: The authorization result.
          content:
            application/json:
              schema:
                type: object
                required:
                - result
                properties:
                  result:
                    type: boolean
                    description: '`true` when the user is authorized on the system.'
        '400':
          description: A key that is not in the allowed list for `user` or `computer` (`"bogus" is not
            allowed`), a scalar `user`/`computer` value instead of a nested one (`"0" is not allowed`),
            or a `$`-prefixed key. Typed error body `InvalidQuery`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: '`user` or `computer` is missing or empty; `domainAndName` has no backslash; an
            `id` value is not a valid object id (`Invalid User ID: "zzz"`); or the user or system is not
            found (`User not found`, `System not found`). Typed error body `UnprocessableEntityError`.
            Unknown lookups return 422, not 404.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /systems/{targetComputerId}:
    put:
      tags:
      - Systems
      operationId: restoreSystem
      summary: Restore a retired system
      description: 'Moves a retired (archived) system back to the active systems list under its original
        id.

        `targetComputerId` is the original id of the system (the `old_id` of the retired record).

        By default the retired copy is deleted after a successful restore. The same operation is

        available at `POST /computers/archived/{targetComputerId}/restore`. The request has no body.


        **Required role:** `admin` or `superadmin`.


        `active` is parsed only as a boolean flag: any value other than `false` restores. With `preservecopy=true`
        the retired record stays in the retired list and a second call returns 409 because the system
        is now active. The 200 body is `{message, restoredId}` as documented.

        '
      security:
      - bearerAuth: []
      parameters:
      - name: targetComputerId
        in: path
        required: true
        description: Original object id of the retired system.
        schema:
          type: string
          pattern: ^[0-9a-fA-F]{24}$
      - name: active
        in: query
        required: false
        description: '`true` restores. `false` is reserved for retiring a system and always returns 501.'
        schema:
          type: boolean
          default: true
      - name: preservecopy
        in: query
        required: false
        description: Keep the retired record after restoring.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Restored.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Computer restored as 00000000000000000000000b
                  restoredId:
                    type: string
                    example: 00000000000000000000000b
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'There is no retired system with that original id (`No stale computer with ID:
            ...`; a well-formed id that matches nothing, including the all-zero id), or the system is
            already active (`Computer ... is already active.`). Typed error body `ConflictError`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '422':
          description: The id is not a valid object id. Typed error body `UnprocessableEntityError`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '501':
          description: '`active=false` (retiring a system) is not implemented. Typed error body.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
  /users:
    get:
      tags:
      - Users
      operationId: listUsers
      summary: List users
      description: 'Returns directory users known to the server (synchronized from the configured domains).

        Each user carries an `access.role` only on the single-user endpoint; the list returns the

        default field set (`distinguishedName`, `displayName`, `cn`, `sn`, `sAMAccountName`,

        `objectSid`, `domain_fqdn`, `domain_netbios`) plus the object `id`.


        Any other user field can be used as an equality filter in the query string. Unknown or

        non-selectable fields return 400. With `advanced`, the filter operators of the advanced

        query syntax apply and `select` can choose the returned fields.


        The response is a JSON array by default. With `inlinePageInfo` the body is wrapped in a

        paging envelope. Paging is also reported in `X-Pagination-*` headers and the `Link` header.


        **Required role:** `user`, `admin` or `superadmin` (any authenticated user).

        '
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/PageParam'
      - $ref: '#/components/parameters/SortParam'
      - $ref: '#/components/parameters/InlinePageInfoParam'
      - $ref: '#/components/parameters/AdvancedParam'
      - $ref: '#/components/parameters/SelectParam'
      responses:
        '200':
          description: A page of users.
          headers:
            X-Pagination-Count:
              $ref: '#/components/headers/X-Pagination-Count'
            X-Pagination-Max-Count:
              $ref: '#/components/headers/X-Pagination-Max-Count'
            X-Pagination-Page:
              $ref: '#/components/headers/X-Pagination-Page'
            X-Pagination-Pages:
              $ref: '#/components/headers/X-Pagination-Pages'
            X-Pagination-Total:
              $ref: '#/components/headers/X-Pagination-Total'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/json:
              schema:
                oneOf:
                - type: array
                  items:
                    $ref: '#/components/schemas/PlatformUser'
                - allOf:
                  - $ref: '#/components/schemas/PagedEnvelope'
                  - type: object
                    properties:
                      docs:
                        type: array
                        items:
                          $ref: '#/components/schemas/PlatformUser'
        '400':
          description: Invalid query (unknown field or non-string value). Typed error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users/{userId}:
    parameters:
    - name: userId
      in: path
      required: true
      description: Object id of the user (24-character hex string).
      schema:
        type: string
        pattern: ^[0-9a-fA-F]{24}$
    get:
      tags:
      - Users
      operationId: getUser
      summary: Get a user
      description: 'Returns one user, including the fields that the list omits (`access`, `linux_config`,

        `isEntraId`, `isHybrid`, timestamps). The Google Authenticator secret is never returned.


        **Required role:** any authenticated user.

        '
      security:
      - bearerAuth: []
      responses:
        '200':
          description: The user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
    patch:
      tags:
      - Users
      operationId: updateUser
      summary: Update a user's Linux configuration
      description: 'Merges the supplied `linux_config` into the user''s stored Linux account properties
        (the

        UID, GID, home directory and default shell used when the account is created on a Linux

        system). Only `linux_config` can be changed with this endpoint. Properties not supplied

        keep their current values. The body may be JSON or form-encoded.


        **Required role:** `admin` or `superadmin`.


        Only the `linux_config` fields you send are changed; fields you leave out keep their stored values
        (a partial update, not a replacement). An empty `linux_config` object succeeds and changes nothing.
        With a form-encoded body, send the fields with bracket names (`linux_config[uid]=20003&linux_config[home_dir]=/home/y`);
        a single flat `linux_config` form field is accepted with 200 but does nothing. A value that cannot
        be stored (for example a non-numeric `uid`) returns 400 `ValidationError`. A non-object `linux_config`
        such as a string returns 200 and changes nothing. Other body fields (for example `access`) are
        ignored. Unknown `userId` returns the plain-text 404 `Invalid User ID`.

        '
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformUserUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PlatformUserUpdate'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Successfully updated user's linux config
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFoundText'
        '422':
          description: The body has no `linux_config` ("Missing linux config"). Typed error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorTyped'
        '400':
          description: 'A `linux_config` value could not be stored (for example `uid` is not a number).
            Typed error body with name `ValidationError`. A malformed JSON body returns 400 with the generic
            body `{"error": "..."}`.'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ErrorTyped'
                - $ref: '#/components/schemas/ErrorSimple'
  /users/{userId}/history:
