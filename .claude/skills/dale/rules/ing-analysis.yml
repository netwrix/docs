message: Cut the trailing '-ing' clause or replace it with a specific consequence.
level: warning
reason: "Fires when a sentence states a fact and then tacks on a trailing participle clause or ', which makes/gives/ensures ...' clause that interprets or praises instead of stating a concrete result. Typical openers: ensuring, reflecting, highlighting, underscoring, emphasizing, demonstrating, showcasing, strengthening, making this/it ..., giving you ..., helping you ..., which makes/means .... Examples: 'The scan runs nightly, ensuring your data stays current'; 'The policy applies to all users, highlighting its importance'; 'The engine evaluates each rule, highlighting gaps and reflecting the state of your environment'. If a clause names a specific, checkable effect ('the job writes a log, which you can review under Reports') it is not a violation. Does not fire on '-ing' clauses that describe a concrete action."
